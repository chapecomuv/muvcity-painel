<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0d1829">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MuvCity Motorista">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="icon-192.png">
<title>MuvCity — Motorista</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#060d1a;--bg2:#0c1727;--bg3:#162033;
  --tx:#e6ecf6;--txm:#7689a1;--bd:rgba(148,163,184,.14);
  --pr:#06b6d4;--prl:#67e8f9;--prd:#0891b2;
  --sc:#10b981;--sc2:#34d399;--dg:#ef4444;--wn:#f59e0b;--vio:#a78bfa;
}
html,body{height:100%}
body{
  font-family:'Inter',system-ui,sans-serif;
  background:
    radial-gradient(900px 600px at 50% -100px,rgba(6,182,212,.15),transparent 60%),
    radial-gradient(700px 500px at 100% 100%,rgba(16,185,129,.10),transparent 60%),
    var(--bg);
  background-attachment:fixed;
  color:var(--tx);font-size:14.5px;line-height:1.55;
  overflow-x:hidden;
}
input,select,textarea,button{font-family:inherit}
button{cursor:pointer;border:none;background:none;color:inherit}

/* App shell */
.app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding:0 0 90px;position:relative}
.app-head{
  position:sticky;top:0;z-index:10;
  background:linear-gradient(180deg,rgba(6,13,26,.96),rgba(6,13,26,.85));
  backdrop-filter:blur(14px);
  border-bottom:1px solid rgba(148,163,184,.1);
  padding:14px 18px;display:flex;align-items:center;gap:12px
}
.brand-mini{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#06b6d4,#10b981);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(6,182,212,.4);flex-shrink:0;overflow:hidden}
.brand-mini img{width:100%;height:100%;object-fit:cover}
.brand-mini svg{color:#fff}
.head-info{flex:1;min-width:0}
.head-title{font-size:15px;font-weight:800;letter-spacing:-.2px}
.head-sub{font-size:11px;color:var(--txm);font-weight:600;letter-spacing:.4px;text-transform:uppercase}
.head-btn{padding:8px;border-radius:9px;background:rgba(255,255,255,.04);border:1px solid var(--bd);color:var(--txm);transition:all .15s}
.head-btn:active{transform:scale(.92);background:rgba(255,255,255,.08)}

/* Cards / Sections */
.section{padding:18px}
.card{
  background:linear-gradient(160deg,rgba(255,255,255,.04),rgba(255,255,255,.012));
  border:1px solid var(--bd);
  border-radius:16px;padding:16px 18px;
  position:relative;overflow:hidden;
  transition:all .2s
}
.card.click{cursor:pointer}
.card.click:active{transform:scale(.985)}
.section-title{font-size:11px;font-weight:800;letter-spacing:.7px;color:var(--prl);text-transform:uppercase;margin:6px 4px 10px}

/* Forms */
.fl{font-size:11px;font-weight:800;letter-spacing:.4px;color:var(--prl);text-transform:uppercase;margin-bottom:5px;display:block}
.fc{
  width:100%;background:rgba(255,255,255,.04);border:1px solid var(--bd);
  border-radius:11px;padding:12px 14px;color:var(--tx);font-size:14.5px;
  transition:all .18s;outline:none
}
.fc:focus{border-color:var(--pr);background:rgba(6,182,212,.06);box-shadow:0 0 0 3px rgba(6,182,212,.15)}
.fc::placeholder{color:rgba(118,137,161,.5)}
textarea.fc{min-height:80px;resize:vertical}
.fg{margin-bottom:12px}
.fr2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* Buttons */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:13px 18px;border-radius:12px;font-size:14.5px;font-weight:700;letter-spacing:-.1px;
  transition:all .18s;width:100%;
  border:1px solid transparent;
}
.btn:active{transform:scale(.97)}
.btn-pr{background:linear-gradient(135deg,#06b6d4,#0891b2);color:#fff;box-shadow:0 6px 18px rgba(6,182,212,.4)}
.btn-sc{background:linear-gradient(135deg,#10b981,#22d3a3);color:#fff;box-shadow:0 6px 18px rgba(16,185,129,.4)}
.btn-dg{background:linear-gradient(135deg,#ef4444,#f97373);color:#fff;box-shadow:0 6px 18px rgba(239,68,68,.4)}
.btn-wn{background:linear-gradient(135deg,#f59e0b,#fbbf24);color:#fff;box-shadow:0 6px 18px rgba(245,158,11,.4)}
.btn-vio{background:linear-gradient(135deg,#7c3aed,#a78bfa);color:#fff;box-shadow:0 6px 18px rgba(124,58,237,.4)}
.btn-ghost{background:rgba(255,255,255,.04);border-color:var(--bd);color:var(--tx)}
.btn-ghost:hover{background:rgba(255,255,255,.08)}
.btn-sm{padding:9px 14px;font-size:13px;border-radius:10px}
.btn-lg{padding:16px;font-size:16px;font-weight:800;border-radius:14px}

/* Status pills */
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:14px;font-size:10px;font-weight:800;letter-spacing:.5px;text-transform:uppercase}
.pill-prog{background:rgba(245,158,11,.16);color:#fbbf24;border:1px solid rgba(245,158,11,.3)}
.pill-and{background:rgba(6,182,212,.18);color:#67e8f9;border:1px solid rgba(6,182,212,.3)}
.pill-fim{background:rgba(16,185,129,.16);color:#34d399;border:1px solid rgba(16,185,129,.3)}

/* Trip card */
.trip-card{margin-bottom:12px;cursor:pointer}
.trip-card:active{transform:scale(.99)}
.trip-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px}
.trip-id{font-size:10.5px;color:var(--txm);font-weight:700;letter-spacing:.4px;font-family:'JetBrains Mono',monospace}
.trip-route{font-size:16px;font-weight:800;letter-spacing:-.2px;margin:4px 0}
.trip-route .arrow{color:var(--txm);margin:0 5px}
.trip-meta{font-size:12px;color:var(--txm);display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.trip-meta b{color:#cbd5f5}

/* KPI big */
.big-kpi{
  background:linear-gradient(160deg,rgba(6,182,212,.08),rgba(16,185,129,.04));
  border:1px solid rgba(6,182,212,.22);
  border-radius:18px;padding:20px;text-align:center;margin-bottom:16px
}
.big-kpi-l{font-size:11px;font-weight:800;letter-spacing:.6px;color:var(--prl);text-transform:uppercase;margin-bottom:6px}
.big-kpi-v{font-size:32px;font-weight:800;letter-spacing:-.6px;line-height:1;font-variant-numeric:tabular-nums}
.big-kpi-s{font-size:12px;color:var(--txm);margin-top:6px}

/* Lançamentos list */
.lanc-row{
  display:flex;align-items:center;gap:12px;padding:13px 14px;
  background:linear-gradient(135deg,rgba(255,255,255,.025),rgba(255,255,255,.012));
  border:1px solid var(--bd);border-radius:13px;margin-bottom:8px
}
.lanc-icon{width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;background:rgba(255,255,255,.04);border:1px solid var(--bd)}
.lanc-info{flex:1;min-width:0}
.lanc-title{font-size:13.5px;font-weight:600}
.lanc-sub{font-size:11px;color:var(--txm);margin-top:2px}
.lanc-amt{font-size:14.5px;font-weight:800;color:#fca5a5;letter-spacing:-.2px}

/* Categoria buttons (4 boxes) */
.cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.cat-btn{
  background:linear-gradient(160deg,rgba(255,255,255,.05),rgba(255,255,255,.012));
  border:1px solid var(--bd);
  border-radius:14px;padding:18px 14px;
  text-align:center;cursor:pointer;transition:all .18s;
  display:flex;flex-direction:column;align-items:center;gap:8px
}
.cat-btn:active{transform:scale(.95)}
.cat-btn:hover{border-color:rgba(6,182,212,.4)}
.cat-btn.alim{--c:#10b981}
.cat-btn.fuel{--c:#3b82f6}
.cat-btn.hosp{--c:#a78bfa}
.cat-btn.other{--c:#f59e0b}
.cat-btn-ic{width:50px;height:50px;border-radius:14px;background:linear-gradient(135deg,var(--c),var(--c));display:flex;align-items:center;justify-content:center;font-size:24px;color:#fff;box-shadow:0 6px 16px rgba(0,0,0,.3)}
.cat-btn-l{font-size:13px;font-weight:700}

/* Empty */
.empty{text-align:center;padding:48px 18px;color:var(--txm)}
.empty-ic{font-size:54px;margin-bottom:14px;opacity:.6}
.empty-tx{font-size:14.5px;font-weight:600;color:#cbd5f5;margin-bottom:6px}
.empty-sub{font-size:12.5px;color:var(--txm);line-height:1.6;margin-bottom:18px}

/* Modal */
.overlay{display:none;position:fixed;inset:0;background:rgba(2,6,15,.85);z-index:200;backdrop-filter:blur(8px);align-items:flex-end;justify-content:center;padding:0}
.overlay.show{display:flex;animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{
  background:linear-gradient(180deg,#0e1a2d,#0a1422);
  border-top:1px solid rgba(123,169,249,.35);
  border-radius:24px 24px 0 0;
  width:100%;max-width:480px;padding:22px 20px 26px;max-height:88vh;overflow-y:auto;
  animation:slideUp .3s cubic-bezier(.22,.9,.35,1)
}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid var(--bd)}
.modal-t{font-size:17px;font-weight:800;letter-spacing:-.2px}
.modal-x{padding:8px;border-radius:9px;background:rgba(255,255,255,.04);color:var(--txm);transition:all .15s}
.modal-x:active{transform:scale(.92);background:rgba(239,68,68,.14);color:#fca5a5}

/* Toast */
.toast-host{position:fixed;top:14px;left:14px;right:14px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{padding:12px 16px;border-radius:12px;font-size:13.5px;font-weight:600;color:#fff;box-shadow:0 12px 32px rgba(0,0,0,.5);animation:tin .25s ease;pointer-events:auto}
.toast.ok{background:linear-gradient(135deg,#10b981,#22d3a3);border:1px solid rgba(16,185,129,.5)}
.toast.warn{background:linear-gradient(135deg,#f59e0b,#fbbf24);border:1px solid rgba(245,158,11,.5)}
.toast.err{background:linear-gradient(135deg,#ef4444,#f97373);border:1px solid rgba(239,68,68,.5)}
@keyframes tin{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}

/* Scrollbar */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-thumb{background:rgba(123,169,249,.25);border-radius:5px}

/* Splash de boas-vindas */
.welcome{padding:36px 24px;text-align:center}
.welcome-logo{width:88px;height:88px;border-radius:22px;background:linear-gradient(135deg,#06b6d4,#10b981);margin:0 auto 18px;display:flex;align-items:center;justify-content:center;box-shadow:0 16px 36px rgba(6,182,212,.45)}
.welcome h1{font-size:24px;font-weight:800;letter-spacing:-.4px;margin-bottom:6px;background:linear-gradient(135deg,#fff,#a3e8ff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.welcome p{font-size:13.5px;color:var(--txm);line-height:1.6;margin-bottom:22px}

/* Quick stats */
.quick-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.qs{background:linear-gradient(160deg,rgba(255,255,255,.03),rgba(255,255,255,.008));border:1px solid var(--bd);border-radius:11px;padding:10px 8px;text-align:center}
.qs-l{font-size:9.5px;color:var(--txm);font-weight:700;letter-spacing:.4px;text-transform:uppercase;margin-bottom:3px}
.qs-v{font-size:14.5px;font-weight:800;font-variant-numeric:tabular-nums}

/* FAB */
.fab{
  position:fixed;bottom:18px;left:50%;transform:translateX(-50%);
  background:linear-gradient(135deg,#06b6d4,#0891b2);
  color:#fff;padding:14px 24px;border-radius:30px;
  font-size:14.5px;font-weight:800;letter-spacing:-.1px;
  box-shadow:0 10px 28px rgba(6,182,212,.5),0 4px 10px rgba(0,0,0,.2);
  z-index:50;display:flex;align-items:center;gap:8px;
  max-width:calc(100vw - 36px);
  border:1px solid rgba(255,255,255,.1)
}
.fab:active{transform:translateX(-50%) scale(.95)}

/* Foto upload */
.photo-up{
  border:2px dashed rgba(148,163,184,.3);border-radius:14px;padding:24px 18px;
  text-align:center;cursor:pointer;transition:all .18s;background:rgba(255,255,255,.02)
}
.photo-up:hover{border-color:var(--pr);background:rgba(6,182,212,.04)}
.photo-up-ic{font-size:32px;opacity:.5;margin-bottom:6px}
.photo-up-l{font-size:12.5px;color:#cbd5f5;font-weight:600}
.photo-up-s{font-size:11px;color:var(--txm);margin-top:3px}
.photo-preview{width:100%;border-radius:12px;margin-top:8px;border:1px solid var(--bd)}

/* Helper banners */
.banner{padding:11px 14px;border-radius:11px;font-size:12.5px;line-height:1.5;display:flex;gap:8px;margin-bottom:14px}
.banner.info{background:rgba(6,182,212,.08);border:1px solid rgba(6,182,212,.25);color:#a3e8ff}
.banner.warn{background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.3);color:#fbbf24}
</style>
</head>
<body>

<div class="toast-host" id="toast-host"></div>

<div class="app" id="app"></div>

<script>
// ════════════════════════════════════════════════════════════
//  MUVCITY — APP DO MOTORISTA
// ════════════════════════════════════════════════════════════

let DB = {};
const KEY = 'muvcity_motorista_db';

function loadDB(){
  try{
    const s=localStorage.getItem(KEY);
    DB = s ? JSON.parse(s) : { driver:null, trips:[] };
  }catch(_){ DB={driver:null,trips:[]}; }
  if(!DB.driver) DB.driver=null;
  if(!Array.isArray(DB.trips)) DB.trips=[];
}
function saveDB(){
  localStorage.setItem(KEY, JSON.stringify(DB));
  if(cloudSync.enabled) cloudSync.scheduledPush();
}

// ════════════════════════════════════════════════════════════════
//  CLOUD SYNC — Firebase RTDB (compartilhado com gestor/sócio)
// ════════════════════════════════════════════════════════════════
// 🔥 URL Firebase hardcoded — funciona automático sem configurar
const FIREBASE_URL_DEFAULT = 'https://muvcity-painel-default-rtdb.firebaseio.com/db.json';

const cloudSync = {
  KEY:'muvcity_sync_url',
  POLL_INTERVAL:20000,PUSH_DEBOUNCE:600,
  enabled:false,url:null,pollTimer:null,pushTimer:null,status:'idle',
  init(){
    this.url=localStorage.getItem(this.KEY) || FIREBASE_URL_DEFAULT;
    this.enabled=true;
    this.startPolling();
    this.renderIndicator();
  },
  setURL(url){
    if(url && !url.endsWith('.json')) url=url.replace(/\/?$/,'/db.json');
    if(url) localStorage.setItem(this.KEY,url); else localStorage.removeItem(this.KEY);
    this.url=url; this.enabled=!!url;
    if(this.enabled) this.startPolling(); else this.stopPolling();
    this.renderIndicator();
  },
  scheduledPush(){
    if(!this.enabled) return;
    clearTimeout(this.pushTimer);
    this.pushTimer=setTimeout(()=>this.push(),this.PUSH_DEBOUNCE);
  },
  // Motorista escreve em path /driver/<phone>/<tripId> pra não conflitar com o DB principal
  driverPath(){
    const phone=(DB.driver?.phone||'sem-tel').replace(/\D/g,'')||'anon';
    return this.url.replace('/db.json','/drivers/'+phone+'.json');
  },
  async push(){
    if(!this.enabled||!this.url||!DB.driver) return;
    this.setStatus('syncing');
    try{
      const ts=Date.now();
      const payload={...DB,_meta:{lastWrite:ts,updatedAt:new Date().toISOString()}};
      const res=await fetch(this.driverPath(),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
      if(!res.ok) throw new Error('HTTP '+res.status);
      this.setStatus('ok');
    }catch(e){console.warn('[sync] push',e); this.setStatus('error');}
  },
  // Pull: motorista baixa as VIAGENS designadas pra ele do path /trips-for-driver/<phone>
  async pull(){
    if(!this.enabled||!this.url||!DB.driver) return;
    try{
      const phone=(DB.driver?.phone||'').replace(/\D/g,'');
      if(!phone) return;
      // Busca o DB principal e procura viagens com driverPhone correspondente
      const res=await fetch(this.url.replace('/db.json','/db.json?cb='+Date.now()));
      if(!res.ok) throw new Error('HTTP '+res.status);
      const main=await res.json();
      if(!main||!main.trips) { this.setStatus('ok'); return; }
      const myTrips=(main.trips||[]).filter(t=>{
        const tp=(t.driverPhone||'').replace(/\D/g,'');
        return (tp && tp===phone) || (t.driverName && DB.driver.name && t.driverName.toLowerCase().includes(DB.driver.name.toLowerCase().split(' ')[0]));
      });
      let newCount=0;
      myTrips.forEach(t=>{
        const veh=(main.vehicles||[]).find(v=>v.id===t.vehicleId);
        const enriched={
          id:t.id,
          code:'MV-'+(t.id||'').slice(-6).toUpperCase(),
          date:t.date||t.departureDate,
          returnDate:t.returnDate||null,
          origin:t.origin||'',destination:t.destination||'',
          description:t.description||'',
          vehicleId:t.vehicleId,
          vehiclePlate:veh?.plate||'',
          vehicleModel:[veh?.brand,veh?.model].filter(Boolean).join(' '),
          client:t.client||'',
          driverName:t.driverName||'',
          status:t.driverStatus||'programada',
          expenses:t.driverExpenses||[],
          kmStart:t.kmStart||null, kmEnd:t.kmEnd||null,
          startedAt:t.startedAt||null, finishedAt:t.finishedAt||null,
          createdAt:new Date().toISOString()
        };
        const ex=DB.trips.findIndex(x=>x.id===t.id);
        if(ex===-1){ DB.trips.push(enriched); newCount++; }
        else if(DB.trips[ex].status==='programada' && enriched.status==='programada'){
          // Atualiza só se for programada (não sobrescreve em andamento/finalizada)
          DB.trips[ex]={...DB.trips[ex], origin:enriched.origin, destination:enriched.destination,
            vehiclePlate:enriched.vehiclePlate, vehicleModel:enriched.vehicleModel,
            client:enriched.client, date:enriched.date};
        }
      });
      if(newCount>0){
        localStorage.setItem(KEY,JSON.stringify(DB));
        showToast('☁️ '+newCount+' viagem(ns) recebida(s) do gestor','ok');
        render();
      }
      this.setStatus('ok');
    }catch(e){console.warn('[sync] pull',e); this.setStatus('error');}
  },
  startPolling(){
    if(this.pollTimer) clearInterval(this.pollTimer);
    setTimeout(()=>this.pull(),800);
    this.pollTimer=setInterval(()=>this.pull(),this.POLL_INTERVAL);
  },
  stopPolling(){ if(this.pollTimer){clearInterval(this.pollTimer);this.pollTimer=null;} },
  setStatus(s){ this.status=s; this.renderIndicator(); },
  renderIndicator(){
    let el=document.getElementById('sync-indicator');
    if(!el){
      el=document.createElement('div');
      el.id='sync-indicator';
      el.style.cssText='position:fixed;bottom:78px;right:14px;z-index:300;display:flex;align-items:center;gap:7px;padding:7px 13px;border-radius:22px;background:rgba(13,24,41,.95);border:1px solid rgba(148,163,184,.2);backdrop-filter:blur(12px);font-size:11.5px;font-weight:700;cursor:pointer;box-shadow:0 8px 20px rgba(0,0,0,.4);letter-spacing:.2px;color:#cbd5f5';
      el.onclick=()=>openSyncMotor();
      document.body.appendChild(el);
    }
    if(!this.enabled){ el.innerHTML='<span style="width:8px;height:8px;border-radius:50%;background:#64748b"></span>☁️ Conectar'; el.style.color='#94a3b8'; }
    else if(this.status==='syncing'){ el.innerHTML='<span style="width:8px;height:8px;border-radius:50%;background:#fbbf24"></span>Sincronizando…'; el.style.color='#fbbf24'; }
    else if(this.status==='error'){ el.innerHTML='<span style="width:8px;height:8px;border-radius:50%;background:#ef4444"></span>⚠️ Erro'; el.style.color='#fca5a5'; }
    else { el.innerHTML='<span style="width:8px;height:8px;border-radius:50%;background:#10b981"></span>☁️ Sincronizado'; el.style.color='#34d399'; }
  }
};
function openSyncMotor(){
  const cur=cloudSync.url||'';
  const enabled=cloudSync.enabled;
  const m=document.getElementById('overlay-host')||(()=>{const d=document.createElement('div');d.id='overlay-host';document.body.appendChild(d);return d;})();
  m.innerHTML=`<div class="overlay show" onclick="if(event.target===this)closeAllOverlays()">
    <div class="modal">
      <div class="modal-h"><div class="modal-t">☁️ Conectar à Empresa</div><button class="modal-x" onclick="closeAllOverlays()">✕</button></div>
      <div class="banner info">💡 <span>Cole a <b>URL Firebase</b> que o gestor te enviou. Com ela, as viagens novas chegam automaticamente no seu app.</span></div>
      <div class="fg"><label class="fl">URL Firebase</label>
        <input type="text" class="fc" id="sync-url-m" placeholder="https://muvcity...firebaseio.com/db.json" value="${cur}" style="font-family:monospace;font-size:12px"></div>

function uid(prefix='id'){ return prefix+'_'+Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4); }
function R(v){ return new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(v||0); }
function n(v){
  if(v==null||v==='') return 0;
  const s=String(v).trim();
  if(s.includes(',')) return parseFloat(s.replace(/\./g,'').replace(',','.'))||0;
  return parseFloat(s)||0;
}
function fmtDate(d){ if(!d)return'—'; const p=String(d).split('T')[0].split('-'); return p[2]+'/'+p[1]+'/'+p[0]; }
function fmtPhone(raw){
  const d=String(raw||'').replace(/\D/g,'').slice(0,11);
  if(d.length<=2) return d.length?'('+d:'';
  if(d.length<=6) return `(${d.slice(0,2)}) ${d.slice(2)}`;
  if(d.length<=10) return `(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`;
  return `(${d.slice(0,2)}) ${d.slice(2,3)} ${d.slice(3,7)}-${d.slice(7)}`;
}
function maskPhone(input){ if(!input)return; const f=fmtPhone(input.value); if(f!==input.value){input.value=f; try{input.setSelectionRange(f.length,f.length);}catch(_){}} }

function showToast(msg, kind){
  const host=document.getElementById('toast-host');
  const t=document.createElement('div');
  t.className='toast '+(kind||'ok');
  t.textContent=msg;
  host.appendChild(t);
  setTimeout(()=>{ t.style.transition='opacity .3s,transform .3s'; t.style.opacity='0'; t.style.transform='translateY(-10px)'; setTimeout(()=>t.remove(),300); },2400);
}

async function fetchTripByCode(){
  const inp=document.getElementById('imp-code');
  const code=(inp?.value||'').replace(/\D/g,'');
  if(code.length!==6){ showToast('Digite os 6 dígitos','warn'); return; }
  const status=document.getElementById('imp-status');
  const btn=document.getElementById('imp-btn');
  if(btn) btn.disabled=true;
  if(status){ status.style.display=''; status.innerHTML='⏳ Buscando viagem…'; status.style.color='#67e8f9'; }
  try{
    const url=cloudSync.url||FIREBASE_URL_DEFAULT;
    const base=url.replace('/db.json','');
    const res=await fetch(base+'/trip-codes/'+code+'.json?cb='+Date.now());
    if(!res.ok) throw new Error('HTTP '+res.status);
    const t=await res.json();
    if(!t || !t.id){
      throw new Error('Código não encontrado. Confirme com o gestor se está correto.');
    }
    // Verifica duplicidade
    if(DB.trips.some(x=>x.id===t.id)){
      if(!confirm('Esta viagem já foi recebida antes. Substituir os dados?')){
        closeAllOverlays(); return;
      }
      DB.trips=DB.trips.filter(x=>x.id!==t.id);
    }
    // Cria entry no app
    DB.trips.push({
      id:t.id,
      code:'#'+code,
      date:t.date,
      returnDate:t.returnDate,
      origin:t.origin||'',
      destination:t.destination||'',
      description:t.description||'',
      vehicleId:t.vehicleId,
      vehiclePlate:t.vehiclePlate||'',
      vehicleModel:t.vehicleModel||'',
      client:t.client||'',
      driverName:t.driverName||'',
      status:'programada',
      expenses:[],
      createdAt:new Date().toISOString(),
      _firebaseCode:code
    });
    saveDB();
    closeAllOverlays();
    showToast('✅ Viagem recebida com sucesso!','ok');
    render();
  }catch(err){
    if(status){ status.innerHTML='❌ '+err.message; status.style.color='#fca5a5'; }
    if(btn) btn.disabled=false;
  }
}

function calcFuelTotal(idL,idP,idT){
  const L=n(document.getElementById(idL).value);

    document.getElementById(idT).value=(L*P).toFixed(2).replace('.',',');
  }
}
function startTrip(tripId){

  const when=document.getElementById('st-when').value;
  trip.kmStart=km;
  trip.startedAt=when||new Date().toISOString();
  trip.status='andamento';
  // Abastecimento inicial (opcional)
  const fuelL=n(document.getElementById('st-fuel-liters').value);
  const fuelT=n(document.getElementById('st-fuel-total').value);
  if(fuelL>0||fuelT>0){
    trip.expenses=trip.expenses||[];
    trip.expenses.push({
      id:uid('lanc'),
      type:'combustivel',
      date:when?when.split('T')[0]:new Date().toISOString().split('T')[0],
      amount:fuelT,
      liters:fuelL,
      pricePerLiter:n(document.getElementById('st-fuel-pl').value),

}

function saveLanc(tripId, type){
  const trip=DB.trips.find(t=>t.id===tripId); if(!trip) return;
  const amount=n(document.getElementById('l-amount').value);
  if(amount<=0){ showToast('Informe o valor','warn'); return; }
  const date=document.getElementById('l-date').value || new Date().toISOString().split('T')[0];
  const lanc={
    id:uid('lanc'),
    type,
    amount,
    date
  };
  if(type==='alimentacao'){
    lanc.mealType=document.getElementById('l-meal').value;
    lanc.description=(document.getElementById('l-desc').value||'').trim();
  } else if(type==='combustivel'){
    const km=n(document.getElementById('l-km').value);
    if(km<=0){ showToast('Informe o KM no momento do abastecimento','warn'); return; }
    lanc.kmAtPump=km;
    lanc.liters=n(document.getElementById('l-liters').value);
    lanc.pricePerLiter=n(document.getElementById('l-pl').value);
    lanc.description=(document.getElementById('l-desc').value||'').trim();
  } else if(type==='hospedagem'){
    lanc.description=(document.getElementById('l-desc').value||'').trim();
    lanc.days=parseInt(document.getElementById('l-days').value)||1;
    lanc.city=(document.getElementById('l-city').value||'').trim();
  } else {
    const desc=(document.getElementById('l-desc').value||'').trim();
    if(!desc){ showToast('Descreva o que foi gasto','warn'); return; }
    lanc.description=desc;
  }
  trip.expenses=trip.expenses||[];
  trip.expenses.push(lanc);
  saveDB();
  closeAllOverlays();
  showToast('💾 Lançamento salvo!','ok');
  render();
}

function finishTrip(tripId){
  const trip=DB.trips.find(t=>t.id===tripId); if(!trip) return;
  const km=n(document.getElementById('ft-km').value);
  if(km<=0){ showToast('Informe o KM final','warn'); return; }
  if(km < n(trip.kmStart)){ showToast('KM final não pode ser menor que o inicial!','err'); return; }
  const fuelL=n(document.getElementById('ft-fuel-liters').value);
  const fuelP=n(document.getElementById('ft-fuel-pl').value);
  const fuelT=n(document.getElementById('ft-fuel-total').value);
  if(fuelL<=0 || fuelT<=0){ showToast('⚠️ Informe o abastecimento final (litros + total)','err'); return; }
  const when=document.getElementById('ft-when').value;
  trip.kmEnd=km;
  trip.finishedAt=when||new Date().toISOString();
  trip.status='finalizada';
  trip.expenses=trip.expenses||[];
  trip.expenses.push({
    id:uid('lanc'),
    type:'combustivel',
    date:when?when.split('T')[0]:new Date().toISOString().split('T')[0],
    amount:fuelT,
    liters:fuelL,
    pricePerLiter:fuelP,
    kmAtPump:km,
    label:'Abastecimento final (tanque cheio)',
    isFinalFuel:true
  });
  saveDB();
  closeAllOverlays();
  showToast('🏁 Viagem finalizada! Não esqueça de enviar pro gestor.','ok');
  render();
}

// ════════ EXPORTAR PRO GESTOR ════════
function exportTripToManager(tripId){
  const trip=DB.trips.find(t=>t.id===tripId); if(!trip) return;
  const payload={
    type:'muvcity-trip-result',
    version:'1.0',
    exportedAt:new Date().toISOString(),
    exportedBy:DB.driver.name,
    driverPhone:DB.driver.phone,
    trip:trip
  };
  const json=JSON.stringify(payload,null,2);
  // Tenta usar Web Share API (celular)
  if(navigator.share){
    const blob=new Blob([json],{type:'application/json'});
    const file=new File([blob],`muvcity_${trip.code||trip.id}_${DB.driver.name.split(' ')[0]}.json`,{type:'application/json'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      navigator.share({title:'Viagem MuvCity', text:`Viagem ${trip.code||''} de ${DB.driver.name}`, files:[file]}).catch(()=>downloadJSON(json,trip));
      return;
    }
  }
  downloadJSON(json,trip);
}
function downloadJSON(json, trip){
  const blob=new Blob([json],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download=`muvcity_${trip.code||trip.id.slice(0,10)}_${(DB.driver.name||'motorista').split(' ')[0]}.json`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('📤 Arquivo gerado! Envie pro gestor pelo WhatsApp.','ok');
}

// ════════ DETECTAR VIAGEM NA URL ════════
async function checkURLForTrip(){
  try{
    const params=new URLSearchParams(location.search);
    // Novo formato: ?codigo=123456
    const codigo=params.get('codigo');
    if(codigo && /^\d{6}$/.test(codigo)){
      // Aguarda o app inicializar antes de buscar
      setTimeout(()=>{
        const inp=document.createElement('input');
        // Simula entrada do código
        if(DB.driver){
          // Já está cadastrado — abre o modal com código preenchido
          openImportModal();
          setTimeout(()=>{
            const e=document.getElementById('imp-code');
            if(e){ e.value=codigo; fetchTripByCode(); }
          },300);
        }
        history.replaceState({},'',location.pathname);
      },1000);
      return;
    }
    // Formato antigo (base64) — mantém compatibilidade
    const tripCode=params.get('trip');
    if(!tripCode) return;
    const json=JSON.parse(decodeURIComponent(escape(atob(tripCode))));
    if(json && json.type==='muvcity-trip' && json.trip){
      const t=json.trip;
      if(!DB.trips.some(x=>x.id===t.id)){
        t.status=t.status||'programada';
        t.expenses=t.expenses||[];
        t.createdAt=t.createdAt||new Date().toISOString();
        DB.trips.push(t);
        saveDB();
        showToast('✅ Viagem recebida do gestor!','ok');
        history.replaceState({},'',location.pathname);
      }
    }
  }catch(_){}
}
