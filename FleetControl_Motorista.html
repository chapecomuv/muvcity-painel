<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0d1829">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MuvCity Motorista">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="icon-192.png">
<title>MuvCity — Motorista</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#060d1a;--bg2:#0c1727;--bg3:#162033;
  --tx:#e6ecf6;--txm:#7689a1;--bd:rgba(148,163,184,.14);
  --pr:#06b6d4;--prl:#67e8f9;--prd:#0891b2;
  --sc:#10b981;--sc2:#34d399;--dg:#ef4444;--wn:#f59e0b;--vio:#a78bfa;
}
html,body{height:100%}
body{
  font-family:'Inter',system-ui,sans-serif;
  background:
    radial-gradient(900px 600px at 50% -100px,rgba(6,182,212,.15),transparent 60%),
    radial-gradient(700px 500px at 100% 100%,rgba(16,185,129,.10),transparent 60%),
    var(--bg);
  background-attachment:fixed;
  color:var(--tx);font-size:14.5px;line-height:1.55;
  overflow-x:hidden;
}
input,select,textarea,button{font-family:inherit}
button{cursor:pointer;border:none;background:none;color:inherit}

/* App shell */
.app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding:0 0 90px;position:relative}
.app-head{
  position:sticky;top:0;z-index:10;
  background:linear-gradient(180deg,rgba(6,13,26,.96),rgba(6,13,26,.85));
  backdrop-filter:blur(14px);
  border-bottom:1px solid rgba(148,163,184,.1);
  padding:14px 18px;display:flex;align-items:center;gap:12px
}
.brand-mini{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#06b6d4,#10b981);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(6,182,212,.4);flex-shrink:0;overflow:hidden}
.brand-mini img{width:100%;height:100%;object-fit:cover}
.brand-mini svg{color:#fff}
.head-info{flex:1;min-width:0}
.head-title{font-size:15px;font-weight:800;letter-spacing:-.2px}
.head-sub{font-size:11px;color:var(--txm);font-weight:600;letter-spacing:.4px;text-transform:uppercase}
.head-btn{padding:8px;border-radius:9px;background:rgba(255,255,255,.04);border:1px solid var(--bd);color:var(--txm);transition:all .15s}
.head-btn:active{transform:scale(.92);background:rgba(255,255,255,.08)}

/* Cards / Sections */
.section{padding:18px}
.card{
  background:linear-gradient(160deg,rgba(255,255,255,.04),rgba(255,255,255,.012));
  border:1px solid var(--bd);
  border-radius:16px;padding:16px 18px;
  position:relative;overflow:hidden;
  transition:all .2s
}
.card.click{cursor:pointer}
.card.click:active{transform:scale(.985)}
.section-title{font-size:11px;font-weight:800;letter-spacing:.7px;color:var(--prl);text-transform:uppercase;margin:6px 4px 10px}

/* Forms */
.fl{font-size:11px;font-weight:800;letter-spacing:.4px;color:var(--prl);text-transform:uppercase;margin-bottom:5px;display:block}
.fc{
  width:100%;background:rgba(255,255,255,.04);border:1px solid var(--bd);
  border-radius:11px;padding:12px 14px;color:var(--tx);font-size:14.5px;
  transition:all .18s;outline:none
}
.fc:focus{border-color:var(--pr);background:rgba(6,182,212,.06);box-shadow:0 0 0 3px rgba(6,182,212,.15)}
.fc::placeholder{color:rgba(118,137,161,.5)}
textarea.fc{min-height:80px;resize:vertical}
.fg{margin-bottom:12px}
.fr2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* Buttons */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:13px 18px;border-radius:12px;font-size:14.5px;font-weight:700;letter-spacing:-.1px;
  transition:all .18s;width:100%;
  border:1px solid transparent;
}
.btn:active{transform:scale(.97)}
.btn-pr{background:linear-gradient(135deg,#06b6d4,#0891b2);color:#fff;box-shadow:0 6px 18px rgba(6,182,212,.4)}
.btn-sc{background:linear-gradient(135deg,#10b981,#22d3a3);color:#fff;box-shadow:0 6px 18px rgba(16,185,129,.4)}
.btn-dg{background:linear-gradient(135deg,#ef4444,#f97373);color:#fff;box-shadow:0 6px 18px rgba(239,68,68,.4)}
.btn-wn{background:linear-gradient(135deg,#f59e0b,#fbbf24);color:#fff;box-shadow:0 6px 18px rgba(245,158,11,.4)}
.btn-vio{background:linear-gradient(135deg,#7c3aed,#a78bfa);color:#fff;box-shadow:0 6px 18px rgba(124,58,237,.4)}
.btn-ghost{background:rgba(255,255,255,.04);border-color:var(--bd);color:var(--tx)}
.btn-ghost:hover{background:rgba(255,255,255,.08)}
.btn-sm{padding:9px 14px;font-size:13px;border-radius:10px}
.btn-lg{padding:16px;font-size:16px;font-weight:800;border-radius:14px}

/* Status pills */
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:14px;font-size:10px;font-weight:800;letter-spacing:.5px;text-transform:uppercase}
.pill-prog{background:rgba(245,158,11,.16);color:#fbbf24;border:1px solid rgba(245,158,11,.3)}
.pill-and{background:rgba(6,182,212,.18);color:#67e8f9;border:1px solid rgba(6,182,212,.3)}
.pill-fim{background:rgba(16,185,129,.16);color:#34d399;border:1px solid rgba(16,185,129,.3)}

/* Trip card */
.trip-card{margin-bottom:12px;cursor:pointer}
.trip-card:active{transform:scale(.99)}
.trip-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px}
.trip-id{font-size:10.5px;color:var(--txm);font-weight:700;letter-spacing:.4px;font-family:'JetBrains Mono',monospace}
.trip-route{font-size:16px;font-weight:800;letter-spacing:-.2px;margin:4px 0}
.trip-route .arrow{color:var(--txm);margin:0 5px}
.trip-meta{font-size:12px;color:var(--txm);display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.trip-meta b{color:#cbd5f5}

/* KPI big */
.big-kpi{
  background:linear-gradient(160deg,rgba(6,182,212,.08),rgba(16,185,129,.04));
  border:1px solid rgba(6,182,212,.22);
  border-radius:18px;padding:20px;text-align:center;margin-bottom:16px
}
.big-kpi-l{font-size:11px;font-weight:800;letter-spacing:.6px;color:var(--prl);text-transform:uppercase;margin-bottom:6px}
.big-kpi-v{font-size:32px;font-weight:800;letter-spacing:-.6px;line-height:1;font-variant-numeric:tabular-nums}
.big-kpi-s{font-size:12px;color:var(--txm);margin-top:6px}

/* Lançamentos list */
.lanc-row{
  display:flex;align-items:center;gap:12px;padding:13px 14px;
  background:linear-gradient(135deg,rgba(255,255,255,.025),rgba(255,255,255,.012));
  border:1px solid var(--bd);border-radius:13px;margin-bottom:8px
}
.lanc-icon{width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;background:rgba(255,255,255,.04);border:1px solid var(--bd)}
.lanc-info{flex:1;min-width:0}
.lanc-title{font-size:13.5px;font-weight:600}
.lanc-sub{font-size:11px;color:var(--txm);margin-top:2px}
.lanc-amt{font-size:14.5px;font-weight:800;color:#fca5a5;letter-spacing:-.2px}

/* Categoria buttons (4 boxes) */
.cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.cat-btn{
  background:linear-gradient(160deg,rgba(255,255,255,.05),rgba(255,255,255,.012));
  border:1px solid var(--bd);
  border-radius:14px;padding:18px 14px;
  text-align:center;cursor:pointer;transition:all .18s;
  display:flex;flex-direction:column;align-items:center;gap:8px
}
.cat-btn:active{transform:scale(.95)}
.cat-btn:hover{border-color:rgba(6,182,212,.4)}
.cat-btn.alim{--c:#10b981}
.cat-btn.fuel{--c:#3b82f6}
.cat-btn.hosp{--c:#a78bfa}
.cat-btn.other{--c:#f59e0b}
.cat-btn-ic{width:50px;height:50px;border-radius:14px;background:linear-gradient(135deg,var(--c),var(--c));display:flex;align-items:center;justify-content:center;font-size:24px;color:#fff;box-shadow:0 6px 16px rgba(0,0,0,.3)}
.cat-btn-l{font-size:13px;font-weight:700}

/* Empty */
.empty{text-align:center;padding:48px 18px;color:var(--txm)}
.empty-ic{font-size:54px;margin-bottom:14px;opacity:.6}
.empty-tx{font-size:14.5px;font-weight:600;color:#cbd5f5;margin-bottom:6px}
.empty-sub{font-size:12.5px;color:var(--txm);line-height:1.6;margin-bottom:18px}

/* Modal */
.overlay{display:none;position:fixed;inset:0;background:rgba(2,6,15,.85);z-index:200;backdrop-filter:blur(8px);align-items:flex-end;justify-content:center;padding:0}
.overlay.show{display:flex;animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{
  background:linear-gradient(180deg,#0e1a2d,#0a1422);
  border-top:1px solid rgba(123,169,249,.35);
  border-radius:24px 24px 0 0;
  width:100%;max-width:480px;padding:22px 20px 26px;max-height:88vh;overflow-y:auto;
  animation:slideUp .3s cubic-bezier(.22,.9,.35,1)
}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid var(--bd)}
.modal-t{font-size:17px;font-weight:800;letter-spacing:-.2px}
.modal-x{padding:8px;border-radius:9px;background:rgba(255,255,255,.04);color:var(--txm);transition:all .15s}
.modal-x:active{transform:scale(.92);background:rgba(239,68,68,.14);color:#fca5a5}

/* Toast */
.toast-host{position:fixed;top:14px;left:14px;right:14px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{padding:12px 16px;border-radius:12px;font-size:13.5px;font-weight:600;color:#fff;box-shadow:0 12px 32px rgba(0,0,0,.5);animation:tin .25s ease;pointer-events:auto}
.toast.ok{background:linear-gradient(135deg,#10b981,#22d3a3);border:1px solid rgba(16,185,129,.5)}
.toast.warn{background:linear-gradient(135deg,#f59e0b,#fbbf24);border:1px solid rgba(245,158,11,.5)}
.toast.err{background:linear-gradient(135deg,#ef4444,#f97373);border:1px solid rgba(239,68,68,.5)}
@keyframes tin{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}

/* Scrollbar */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-thumb{background:rgba(123,169,249,.25);border-radius:5px}

/* Splash de boas-vindas */
.welcome{padding:36px 24px;text-align:center}
.welcome-logo{width:88px;height:88px;border-radius:22px;background:linear-gradient(135deg,#06b6d4,#10b981);margin:0 auto 18px;display:flex;align-items:center;justify-content:center;box-shadow:0 16px 36px rgba(6,182,212,.45)}
.welcome h1{font-size:24px;font-weight:800;letter-spacing:-.4px;margin-bottom:6px;background:linear-gradient(135deg,#fff,#a3e8ff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.welcome p{font-size:13.5px;color:var(--txm);line-height:1.6;margin-bottom:22px}

/* Quick stats */
.quick-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.qs{background:linear-gradient(160deg,rgba(255,255,255,.03),rgba(255,255,255,.008));border:1px solid var(--bd);border-radius:11px;padding:10px 8px;text-align:center}
.qs-l{font-size:9.5px;color:var(--txm);font-weight:700;letter-spacing:.4px;text-transform:uppercase;margin-bottom:3px}
.qs-v{font-size:14.5px;font-weight:800;font-variant-numeric:tabular-nums}

/* FAB */
.fab{
  position:fixed;bottom:18px;left:50%;transform:translateX(-50%);
  background:linear-gradient(135deg,#06b6d4,#0891b2);
  color:#fff;padding:14px 24px;border-radius:30px;
  font-size:14.5px;font-weight:800;letter-spacing:-.1px;
  box-shadow:0 10px 28px rgba(6,182,212,.5),0 4px 10px rgba(0,0,0,.2);
  z-index:50;display:flex;align-items:center;gap:8px;
  max-width:calc(100vw - 36px);
  border:1px solid rgba(255,255,255,.1)
}
.fab:active{transform:translateX(-50%) scale(.95)}

/* Foto upload */
.photo-up{
  border:2px dashed rgba(148,163,184,.3);border-radius:14px;padding:24px 18px;
  text-align:center;cursor:pointer;transition:all .18s;background:rgba(255,255,255,.02)
}
.photo-up:hover{border-color:var(--pr);background:rgba(6,182,212,.04)}
.photo-up-ic{font-size:32px;opacity:.5;margin-bottom:6px}
.photo-up-l{font-size:12.5px;color:#cbd5f5;font-weight:600}
.photo-up-s{font-size:11px;color:var(--txm);margin-top:3px}
.photo-preview{width:100%;border-radius:12px;margin-top:8px;border:1px solid var(--bd)}

/* Helper banners */
.banner{padding:11px 14px;border-radius:11px;font-size:12.5px;line-height:1.5;display:flex;gap:8px;margin-bottom:14px}
.banner.info{background:rgba(6,182,212,.08);border:1px solid rgba(6,182,212,.25);color:#a3e8ff}
.banner.warn{background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.3);color:#fbbf24}
</style>
</head>
<body>

<div class="toast-host" id="toast-host"></div>

<div class="app" id="app"></div>

<script>
// ════════════════════════════════════════════════════════════
//  MUVCITY — APP DO MOTORISTA
// ════════════════════════════════════════════════════════════

let DB = {};
const KEY = 'muvcity_motorista_db';

function loadDB(){
  try{
    const s=localStorage.getItem(KEY);
    DB = s ? JSON.parse(s) : { driver:null, trips:[] };
  }catch(_){ DB={driver:null,trips:[]}; }
  if(!DB.driver) DB.driver=null;
  if(!Array.isArray(DB.trips)) DB.trips=[];
  autoFinalizeOldTrips();
}

// Marca como "finalizada" automaticamente toda viagem com data anterior a hoje
// que ainda esteja como "programada". As de hoje e futuras ficam intactas.
// Útil pra limpar viagens antigas que nunca foram processadas no fluxo do motorista.
function autoFinalizeOldTrips(){
  if(!Array.isArray(DB.trips) || DB.trips.length===0) return;
  const today = new Date();
  today.setHours(0,0,0,0);
  let changed = false;
  DB.trips.forEach(t=>{
    if(t.status !== 'programada') return;
    if(!t.date) return;
    const tripDate = new Date(t.date+'T00:00:00');
    if(isNaN(tripDate.getTime())) return;
    if(tripDate < today){
      t.status = 'finalizada';
      t.autoFinalized = true;   // flag p/ distinguir de finalizações manuais
      t._lastChange = Date.now();
      changed = true;
    }
  });
  if(changed){
    try{ localStorage.setItem(KEY, JSON.stringify(DB)); }catch(_){}
    if(typeof cloudSync==='object' && cloudSync.enabled) cloudSync.scheduledPush();
  }
}
function saveDB(){
  localStorage.setItem(KEY, JSON.stringify(DB));
  if(cloudSync.enabled) cloudSync.scheduledPush();
}

// ════════════════════════════════════════════════════════════════
//  CLOUD SYNC — Firebase RTDB (compartilhado com gestor/sócio)
// ════════════════════════════════════════════════════════════════
// 🔥 URL Firebase hardcoded — funciona automático sem configurar
const FIREBASE_URL_DEFAULT = 'https://muvcity-painel-default-rtdb.firebaseio.com/db.json';

const cloudSync = {
  KEY:'muvcity_sync_url',
  POLL_INTERVAL:20000,PUSH_DEBOUNCE:600,
  enabled:false,url:null,pollTimer:null,pushTimer:null,status:'idle',
  init(){
    this.url=localStorage.getItem(this.KEY) || FIREBASE_URL_DEFAULT;
    this.enabled=true;
    this.startPolling();
    this.renderIndicator();
  },
  setURL(url){
    if(url && !url.endsWith('.json')) url=url.replace(/\/?$/,'/db.json');
    if(url) localStorage.setItem(this.KEY,url); else localStorage.removeItem(this.KEY);
    this.url=url; this.enabled=!!url;
    if(this.enabled) this.startPolling(); else this.stopPolling();
    this.renderIndicator();
  },
  scheduledPush(){
    if(!this.enabled) return;
    clearTimeout(this.pushTimer);
    this.pushTimer=setTimeout(()=>this.push(),this.PUSH_DEBOUNCE);
  },
  // Motorista escreve em path /driver/<phone>/<tripId> pra não conflitar com o DB principal
  driverPath(){
    const phone=(DB.driver?.phone||'sem-tel').replace(/\D/g,'')||'anon';
    return this.url.replace('/db.json','/drivers/'+phone+'.json');
  },
  async push(){
    if(!this.enabled||!this.url||!DB.driver) return;
    this.setStatus('syncing');
    try{
      // 🛡️ PROTEÇÃO ANTI-ZERAÇÃO: se o local tem 0 trips mas o Firebase tem trips com conteúdo, ABORTA.
      // Isso evita que um logout/limpeza acidental do localStorage sobrescreva os dados na nuvem.
      const localTrips=Array.isArray(DB.trips)?DB.trips.length:0;
      const localHasContent=(DB.trips||[]).some(t=>t&&((t.expenses&&t.expenses.length)||t.kmStart||t.kmEnd||t.status==='andamento'||t.status==='finalizada'));
      if(localTrips===0 || !localHasContent){
        try{
          const cur=await fetch(this.driverPath()+'?cb='+Date.now());
          if(cur.ok){
            const remote=await cur.json();
            const remoteTrips=(remote&&Array.isArray(remote.trips))?remote.trips:[];
            const remoteHasContent=remoteTrips.some(t=>t&&((t.expenses&&t.expenses.length)||t.kmStart||t.kmEnd||t.status==='andamento'||t.status==='finalizada'));
            if(remoteHasContent && !localHasContent){
              console.warn('[sync] push ABORTADO: local vazio, nuvem tem dados. Evitando sobrescrita.');
              this.setStatus('ok');
              return;
            }
          }
        }catch(_){}
      }
      const ts=Date.now();
      const payload={...DB,_meta:{lastWrite:ts,updatedAt:new Date().toISOString()}};
      const res=await fetch(this.driverPath(),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
      if(!res.ok) throw new Error('HTTP '+res.status);
      this.setStatus('ok');
    }catch(e){console.warn('[sync] push',e); this.setStatus('error');}
  },
  // Pull: motorista baixa as VIAGENS designadas pra ele do path /trips-for-driver/<phone>
  async pull(){
    if(!this.enabled||!this.url||!DB.driver) return;
    try{
      // Busca o DB principal
      const res=await fetch(this.url.replace('/db.json','/db.json?cb='+Date.now()));
      if(!res.ok) throw new Error('HTTP '+res.status);
      const main=await res.json();
      if(!main){ this.setStatus('ok'); return; }
      // Captura metas dos veículos (pra exibir Meta de Consumo mesmo em viagens importadas)
      if(Array.isArray(main.vehicles)){
        DB.vehicleMeta={};
        main.vehicles.forEach(v=>{
          DB.vehicleMeta[v.id]={
            fuelTargetKmPerL:parseFloat(v.fuelTargetKmPerL)||null,
            tankCapacityL:parseFloat(v.tankCapacityL)||null,
            plate:v.plate||'', model:[v.brand,v.model].filter(Boolean).join(' ')
          };
        });
        try{ localStorage.setItem(KEY,JSON.stringify(DB)); }catch(_){}
      }
      if(!main.trips){ this.setStatus('ok'); return; }
      // Filtra só as viagens designadas a este motorista (match por nome completo OU telefone)
      const myTrips=(main.trips||[]).filter(t=>isMyTrip(t));
      let newCount=0;
      myTrips.forEach(t=>{
        const veh=(main.vehicles||[]).find(v=>v.id===t.vehicleId);
        const enriched={
          id:t.id,
          code:'MV-'+(t.id||'').slice(-6).toUpperCase(),
          date:t.date||t.departureDate,
          returnDate:t.returnDate||null,
          origin:t.origin||'',destination:t.destination||'',
          description:t.description||'',
          vehicleId:t.vehicleId,
          vehiclePlate:veh?.plate||'',
          vehicleModel:[veh?.brand,veh?.model].filter(Boolean).join(' '),
          fuelTargetKmPerL:parseFloat(veh?.fuelTargetKmPerL)||null,
          tankCapacityL:parseFloat(veh?.tankCapacityL)||null,
          client:t.client||'',
          clientPhone:t.clientPhone||'',
          pickupTime:t.pickupTime||'',
          passengers:t.passengers||null,
          itinerary:t.itinerary||'',
          driverName:t.driverName||'',
          driverPhone:t.driverPhone||'',
          status:t.driverStatus||'programada',
          expenses:t.driverExpenses||[],
          kmStart:t.kmStart||null, kmEnd:t.kmEnd||null,
          startedAt:t.startedAt||null, finishedAt:t.finishedAt||null,
          createdAt:new Date().toISOString()
        };
        const ex=DB.trips.findIndex(x=>x.id===t.id);
        if(ex===-1){ DB.trips.push(enriched); newCount++; }
        else if(DB.trips[ex].status==='programada' && enriched.status==='programada'){
          // Atualiza só se for programada (não sobrescreve em andamento/finalizada)
          DB.trips[ex]={...DB.trips[ex], origin:enriched.origin, destination:enriched.destination,
            vehiclePlate:enriched.vehiclePlate, vehicleModel:enriched.vehicleModel,
            fuelTargetKmPerL:enriched.fuelTargetKmPerL, tankCapacityL:enriched.tankCapacityL,
            client:enriched.client, date:enriched.date};
        } else {
          // Trip já em andamento/finalizada: garante que meta de combustível esteja atualizada
          if(enriched.fuelTargetKmPerL!=null) DB.trips[ex].fuelTargetKmPerL=enriched.fuelTargetKmPerL;
          if(enriched.tankCapacityL!=null) DB.trips[ex].tankCapacityL=enriched.tankCapacityL;
        }
      });
      if(newCount>0){
        localStorage.setItem(KEY,JSON.stringify(DB));
        showToast('☁️ '+newCount+' viagem(ns) recebida(s) do gestor','ok');
        render();
      }

      // ═══ RESTAURAÇÃO DO PATH DO MOTORISTA (/drivers/<phone>) ═══
      // Traz de volta trips com expenses/km/status salvos pelo próprio motorista em outros dispositivos
      // (ou neste mesmo após logout/login). Last-write-wins por _lastChange.
      let restoredCount = 0;
      try{
        const rdRes = await fetch(this.driverPath()+'?cb='+Date.now());
        if(rdRes.ok){
          const remoteDriver = await rdRes.json();
          const remoteTrips = (remoteDriver && Array.isArray(remoteDriver.trips)) ? remoteDriver.trips : [];
          remoteTrips.forEach(rt=>{
            if(!rt || !rt.id) return;
            const idx = DB.trips.findIndex(t=>t.id===rt.id);
            if(idx === -1){
              // Trip remota que não existe local → adiciona (recupera dados perdidos)
              DB.trips.push(rt);
              restoredCount++;
            } else {
              // Existe local → merge last-write-wins por _lastChange; se sem timestamp, escolhe quem tem mais conteúdo
              const localLC = parseInt(DB.trips[idx]._lastChange)||0;
              const remoteLC = parseInt(rt._lastChange)||0;
              if(remoteLC > localLC){
                DB.trips[idx] = rt;
                restoredCount++;
              } else if(remoteLC === 0 && localLC === 0){
                const localScore = (DB.trips[idx].expenses||[]).length + (DB.trips[idx].kmEnd?1:0) + (DB.trips[idx].status==='finalizada'?2:0);
                const remoteScore = (rt.expenses||[]).length + (rt.kmEnd?1:0) + (rt.status==='finalizada'?2:0);
                if(remoteScore > localScore){
                  DB.trips[idx] = rt;
                  restoredCount++;
                }
              }
            }
          });
          if(restoredCount > 0){
            localStorage.setItem(KEY,JSON.stringify(DB));
            showToast('🔄 '+restoredCount+' viagem(ns) restaurada(s) da nuvem','ok');
            render();
          }
        }
      }catch(_){ /* offline ou path vazio é OK */ }

      // Após pull, aplica auto-finalize em trips antigas recém-trazidas
      autoFinalizeOldTrips();
      this.setStatus('ok');
    }catch(e){console.warn('[sync] pull',e); this.setStatus('error');}
  },
  startPolling(){
    if(this.pollTimer) clearInterval(this.pollTimer);
    setTimeout(()=>this.pull(),800);
    this.pollTimer=setInterval(()=>this.pull(),this.POLL_INTERVAL);
  },
  stopPolling(){ if(this.pollTimer){clearInterval(this.pollTimer);this.pollTimer=null;} },
  setStatus(s){ this.status=s; this.renderIndicator(); },
  renderIndicator(){
    let el=document.getElementById('sync-indicator');
    if(!el){
      el=document.createElement('div');
      el.id='sync-indicator';
      el.style.cssText='position:fixed;bottom:78px;right:14px;z-index:300;display:flex;align-items:center;gap:7px;padding:7px 13px;border-radius:22px;background:rgba(13,24,41,.95);border:1px solid rgba(148,163,184,.2);backdrop-filter:blur(12px);font-size:11.5px;font-weight:700;cursor:pointer;box-shadow:0 8px 20px rgba(0,0,0,.4);letter-spacing:.2px;color:#cbd5f5';
      el.onclick=()=>openSyncMotor();
      document.body.appendChild(el);
    }
    if(!this.enabled){ el.innerHTML='<span style="width:8px;height:8px;border-radius:50%;background:#64748b"></span>☁️ Conectar'; el.style.color='#94a3b8'; }
    else if(this.status==='syncing'){ el.innerHTML='<span style="width:8px;height:8px;border-radius:50%;background:#fbbf24"></span>Sincronizando…'; el.style.color='#fbbf24'; }
    else if(this.status==='error'){ el.innerHTML='<span style="width:8px;height:8px;border-radius:50%;background:#ef4444"></span>⚠️ Erro'; el.style.color='#fca5a5'; }
    else { el.innerHTML='<span style="width:8px;height:8px;border-radius:50%;background:#10b981"></span>☁️ Sincronizado'; el.style.color='#34d399'; }
  }
};

function uid(prefix='id'){ return prefix+'_'+Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4); }
function R(v){ return new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(v||0); }
function n(v){
  if(v==null||v==='') return 0;
  const s=String(v).trim();
  if(s.includes(',')) return parseFloat(s.replace(/\./g,'').replace(',','.'))||0;
  return parseFloat(s)||0;
}
function fmtDate(d){ if(!d)return'—'; const p=String(d).split('T')[0].split('-'); return p[2]+'/'+p[1]+'/'+p[0]; }
function fmtPhone(raw){
  const d=String(raw||'').replace(/\D/g,'').slice(0,11);
  if(d.length<=2) return d.length?'('+d:'';
  if(d.length<=6) return `(${d.slice(0,2)}) ${d.slice(2)}`;
  if(d.length<=10) return `(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`;
  return `(${d.slice(0,2)}) ${d.slice(2,3)} ${d.slice(3,7)}-${d.slice(7)}`;
}
function maskPhone(input){ if(!input)return; const f=fmtPhone(input.value); if(f!==input.value){input.value=f; try{input.setSelectionRange(f.length,f.length);}catch(_){}} }

function showToast(msg, kind){
  const host=document.getElementById('toast-host');

  t.className='toast '+(kind||'ok');

  host.appendChild(t);
  setTimeout(()=>{ t.style.transition='opacity .3s,transform .3s'; t.style.opacity='0'; t.style.transform='translateY(-10px)'; setTimeout(()=>t.remove(),300); },2400);
}

// Busca a lista de motoristas cadastrados pelo gestor (e guarda metas dos veículos).
let _driversRoster = [];
async function fetchDriversRoster(){
  try{
    const url = (cloudSync.url || FIREBASE_URL_DEFAULT);
    const res = await fetch(url + '?cb=' + Date.now());
    if(!res.ok) return [];
    const data = await res.json();
    // Guarda metas dos veículos (usado pra exibir Meta de Consumo mesmo em viagens importadas)
    if(data && Array.isArray(data.vehicles)){
      DB.vehicleMeta = {};
      data.vehicles.forEach(v=>{
        DB.vehicleMeta[v.id] = {
          fuelTargetKmPerL: parseFloat(v.fuelTargetKmPerL)||null,
          tankCapacityL: parseFloat(v.tankCapacityL)||null,
          plate: v.plate||'',
          model: [v.brand,v.model].filter(Boolean).join(' ')
        };
      });
      try{ localStorage.setItem(KEY, JSON.stringify(DB)); }catch(_){}
    }
    const drivers = (data && Array.isArray(data.drivers)) ? data.drivers : [];
    return drivers.filter(d=>d && d.active!==false && d.name).map(d=>({ name:d.name, phone:d.phone||'', cnh:d.cnh||'', doc:d.doc||'' }));
  }catch(_){ return []; }
}

// Valida o que o motorista digitou (CPF ou nome) contra a lista de cadastrados.
async function tryLogin(){
  const raw=(document.getElementById('w-login')?.value||'').trim();
  const err=document.getElementById('w-login-err');
  const showErr=(msg)=>{ if(err){ err.style.display=''; err.textContent='⚠️ '+msg; } };
  if(!raw){ showErr('Digite seu CPF ou nome completo.'); return; }
  if(!_driversRoster || _driversRoster.length===0){
    showErr('Não consegui carregar a lista de motoristas. Verifique sua internet e tente de novo.');
    return;
  }
  const rawDigits=raw.replace(/\D/g,'');
  const rawName=normalizeName(raw);
  // 1) tenta por CPF (se digitou números suficientes)
  let match=null;
  if(rawDigits.length>=11){
    match=_driversRoster.find(d=>(d.doc||'').replace(/\D/g,'')===rawDigits);
  }
  // 2) senão, tenta por nome completo exato
  if(!match){
    match=_driversRoster.find(d=>normalizeName(d.name)===rawName);
  }
  if(!match){
    showErr('Não encontramos esse CPF/nome no cadastro. Confirme com o gestor se você foi cadastrado.');
    return;
  }
  // Define o driver — IMPORTANTE: não chama saveDB ainda (evita push imediato com trips vazias).
  DB.driver = { name:match.name, phone:match.phone||'', cnh:match.cnh||'', doc:match.doc||'', createdAt:new Date().toISOString() };
  try{ localStorage.setItem(KEY, JSON.stringify(DB)); }catch(_){}
  // Feedback visual + bloqueia novo login enquanto sincroniza
  showErr(''); if(err) err.style.display='none';
  const btn=document.querySelector('#welcome-card .btn-pr'); if(btn){ btn.disabled=true; btn.textContent='🔄 Restaurando suas viagens…'; }
  // PULL ANTES de qualquer push — restaura trips da nuvem (path /drivers/<phone> + /db principal)
  if(typeof cloudSync==='object' && cloudSync.enabled){
    try{ await cloudSync.pull(); }catch(_){}
  }
  showToast('Bem-vindo, '+match.name.split(' ')[0]+'!','ok');
  checkURLForTrip();
  render();
}

// Normaliza nome pra comparação: minúsculo, sem acento, espaços colapsados
function normalizeName(s){
  return (s||'').toString().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ').trim();
}
// Decide se a viagem é do motorista logado.
// Match por telefone (exato) OU nome completo normalizado. Viagens sem motorista designado NÃO aparecem.
function isMyTrip(trip){
  if(!DB.driver) return false;
  const myName = normalizeName(DB.driver.name);
  const myPhone = (DB.driver.phone||'').replace(/\D/g,'');
  const tName = normalizeName(trip.driverName);
  const tPhone = (trip.driverPhone||'').replace(/\D/g,'');
  if(myPhone && tPhone) return myPhone===tPhone;   // se ambos têm telefone, decide por ele
  if(tName && myName) return tName===myName;         // senão, nome completo idêntico
  return false;   // sem identificação → não mostra (evita vazar viagem de outro)
}

  m.innerHTML=`

        </div>
        <div class="banner info">
          💡 <span>O gestor te passa um <b>código de 6 dígitos</b>. Digite abaixo e a viagem aparece automaticamente.</span>
        </div>
        <div class="fg">
          <label class="fl" style="text-align:center;font-size:13px">Código da viagem</label>
          <input type="text" inputmode="numeric" maxlength="6" autocomplete="off" class="fc" id="imp-code"
                 placeholder="000000"
                 style="text-align:center;font-size:38px;font-weight:900;letter-spacing:14px;font-family:'JetBrains Mono',monospace;padding:18px;color:#67e8f9;background:rgba(6,182,212,.05);border-color:rgba(6,182,212,.3)"
                 oninput="this.value=this.value.replace(/\\D/g,'').slice(0,6); if(this.value.length===6) fetchTripByCode();">
        </div>
        <button class="btn btn-pr btn-lg" id="imp-btn" onclick="fetchTripByCode()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          Buscar Viagem
        </button>
        <div id="imp-status" style="margin-top:12px;text-align:center;font-size:12.5px;color:var(--txm);display:none"></div>
      </div>
    </div>`;
  setTimeout(()=>document.getElementById('imp-code')?.focus(),120);

async function fetchTripByCode(){
  const inp=document.getElementById('imp-code');
  const code=(inp?.value||'').replace(/\D/g,'');
  if(code.length!==6){ showToast('Digite os 6 dígitos','warn'); return; }
  const status=document.getElementById('imp-status');
  const btn=document.getElementById('imp-btn');
  if(btn) btn.disabled=true;
  if(status){ status.style.display=''; status.innerHTML='⏳ Buscando viagem…'; status.style.color='#67e8f9'; }
  try{
    const url=cloudSync.url||FIREBASE_URL_DEFAULT;
    const base=url.replace('/db.json','');
    const res=await fetch(base+'/trip-codes/'+code+'.json?cb='+Date.now());
    if(!res.ok) throw new Error('HTTP '+res.status);
    const t=await res.json();
    if(!t || !t.id){
      throw new Error('Código não encontrado. Confirme com o gestor se está correto.');
    }
    // Verifica duplicidade
    if(DB.trips.some(x=>x.id===t.id)){
      if(!confirm('Esta viagem já foi recebida antes. Substituir os dados?')){
        closeAllOverlays(); return;
      }
      DB.trips=DB.trips.filter(x=>x.id!==t.id);
    }
    // Cria entry no app
    DB.trips.push({
      id:t.id,
      code:'#'+code,
      date:t.date,
      returnDate:t.returnDate,
      origin:t.origin||'',
      destination:t.destination||'',
      description:t.description||'',
      vehicleId:t.vehicleId,
      vehiclePlate:t.vehiclePlate||'',
      vehicleModel:t.vehicleModel||'',
      client:t.client||'',
      clientPhone:t.clientPhone||'',
      pickupTime:t.pickupTime||'',
      passengers:t.passengers||null,
      itinerary:t.itinerary||'',
      driverName:t.driverName||'',
      driverPhone:t.driverPhone||'',
      status:'programada',
      expenses:[],
      createdAt:new Date().toISOString(),
      _firebaseCode:code
    });
    saveDB();
    closeAllOverlays();
    showToast('✅ Viagem recebida com sucesso!','ok');
    render();
  }catch(err){
    if(status){ status.innerHTML='❌ '+err.message; status.style.color='#fca5a5'; }
    if(btn) btn.disabled=false;
  }
}

// Card de Meta de Consumo (km/L) — visível ao motorista para incentivo durante e após a viagem.
function renderFuelMetaCard(trip){
  // Meta vem da trip; se faltar (ex: viagem importada por código), busca pela tabela de veículos sincronizada
  let target=parseFloat(trip.fuelTargetKmPerL)||null;
  if(!target && trip.vehicleId && DB.vehicleMeta && DB.vehicleMeta[trip.vehicleId]){
    target=parseFloat(DB.vehicleMeta[trip.vehicleId].fuelTargetKmPerL)||null;
  }
  const stops=(trip.expenses||[])
    .filter(e=>e.type==='combustivel' && n(e.kmAtPump)>0 && n(e.liters)>0)
    .map(e=>({km:n(e.kmAtPump), liters:n(e.liters)}))
    .sort((a,b)=>a.km-b.km);
  // Não exibe se não tem meta nem nenhum abastecimento (motorista programada já não chega aqui)
  if(!target && stops.length===0) return '';
  const r2=v=>Math.round(v*100)/100;
  let kmL=null, kmRange=0, litrosConsumidos=0, calcSource='';
  const kmStart=n(trip.kmStart);
  if(stops.length>=2){
    // Cálculo padrão: entre 1º e último abastecimento, somando litros do 2º em diante
    kmRange=stops[stops.length-1].km-stops[0].km;
    litrosConsumidos=stops.slice(1).reduce((s,fs)=>s+fs.liters,0);
    if(kmRange>0 && litrosConsumidos>0){ kmL=r2(kmRange/litrosConsumidos); calcSource='entre abastecimentos'; }
  } else if(stops.length===1 && kmStart>0 && stops[0].km>kmStart){
    // Cálculo parcial: usa o KM inicial da viagem (assume tanque cheio no início)
    kmRange=stops[0].km-kmStart;
    litrosConsumidos=stops[0].liters;
    if(kmRange>0 && litrosConsumidos>0){ kmL=r2(kmRange/litrosConsumidos); calcSource='desde o KM inicial'; }
  }
  const isFinalized=trip.status==='finalizada';
  const mediaLabel=isFinalized?'🏁 Média Final':'📊 Média Atual';
  // Determina cor/badge baseado na comparação com a meta
  let mediaColor='#94a3b8', badge='', barPct=0, barColor='#64748b';
  if(kmL && target){
    barPct=Math.min(100,Math.max(0,(kmL/target)*100));
    if(kmL>=target){ mediaColor='#10b981'; badge='🏆 ACIMA DA META'; barColor='#10b981'; }
    else if(kmL>=target*0.9){ mediaColor='#f59e0b'; badge='⚠️ PERTO'; barColor='#f59e0b'; }
    else { mediaColor='#ef4444'; badge='🔴 ABAIXO'; barColor='#ef4444'; }
  } else if(kmL){ mediaColor='#67e8f9'; }
  // Aviso só se NÃO conseguiu calcular (sem kmStart ou stops.length===0)
  const aguardaSegundo=(stops.length===1 && !kmL)?`<div style="font-size:11.5px;color:var(--txm);margin-top:8px;font-style:italic">⛽ Aguardando o 2º abastecimento (ou KM inicial da viagem) para calcular o consumo.</div>`:'';
  const semAbast=stops.length===0?`<div style="font-size:11.5px;color:var(--txm);margin-top:8px;font-style:italic">⛽ Registre abastecimentos com KM e litros para calcular o consumo.</div>`:'';
  const calcInfo=(kmL && calcSource==='desde o KM inicial')?`<div style="font-size:10.5px;color:#67e8f9;margin-top:6px;font-style:italic">ℹ️ Cálculo parcial (assumindo tanque cheio no início da viagem). Após o 2º abastecimento o cálculo fica preciso.</div>`:'';
  return `<div style="background:linear-gradient(135deg,rgba(99,102,241,.12) 0%,rgba(168,85,247,.08) 100%);border:1px solid rgba(99,102,241,.25);border-radius:14px;padding:16px;margin:14px 0">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <div style="font-size:12.5px;font-weight:800;letter-spacing:.4px;color:#a5b4fc;text-transform:uppercase">⛽ Consumo de Combustível</div>
      ${badge?`<span style="background:${barColor}22;color:${barColor};padding:3px 9px;border-radius:12px;font-size:11px;font-weight:800;letter-spacing:.3px">${badge}</span>`:''}
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:${kmL&&target?12:0}px">
      <div style="background:rgba(255,255,255,.04);border-radius:10px;padding:10px">
        <div style="font-size:10.5px;color:var(--txm);text-transform:uppercase;letter-spacing:.3px;font-weight:700">🎯 Meta</div>
        <div style="font-size:22px;font-weight:800;color:${target?'#a78bfa':'#64748b'};margin-top:2px">${target?target.toFixed(1)+' km/L':'—'}</div>
      </div>
      <div style="background:rgba(255,255,255,.04);border-radius:10px;padding:10px">
        <div style="font-size:10.5px;color:var(--txm);text-transform:uppercase;letter-spacing:.3px;font-weight:700">${mediaLabel}</div>
        <div style="font-size:22px;font-weight:800;color:${mediaColor};margin-top:2px">${kmL?kmL.toFixed(2)+' km/L':'—'}</div>
      </div>
    </div>
    ${kmL&&target?`<div style="background:rgba(255,255,255,.06);border-radius:8px;height:10px;overflow:hidden;position:relative">
      <div style="background:linear-gradient(90deg,${barColor},${barColor}cc);width:${barPct.toFixed(0)}%;height:100%;border-radius:8px;transition:width .5s ease"></div>
      <div style="position:absolute;right:8px;top:-3px;font-size:10.5px;font-weight:800;color:${barColor};line-height:16px">${barPct.toFixed(0)}%</div>
    </div>`:''}
    ${aguardaSegundo}${semAbast}${calcInfo}
    ${kmL?`<div style="font-size:11px;color:var(--txm);margin-top:10px;display:flex;justify-content:space-between"><span>${kmRange.toLocaleString('pt-BR')} km percorridos</span><span>${litrosConsumidos.toFixed(2)}L consumidos</span></div>`:''}
  </div>`;
}

function renderTripScreen(root, trip){
  const expenses=trip.expenses||[];
  const totalExp=expenses.reduce((s,e)=>s+n(e.amount),0);
  // KM rodado: se finalizada usa kmEnd; se em andamento, calcula parcial a partir do maior kmAtPump dos abastecimentos
  let kmRun = 0;
  let kmRunPartial = false;
  if(n(trip.kmEnd)>0 && n(trip.kmStart)>0){
    kmRun = n(trip.kmEnd) - n(trip.kmStart);
  } else if(n(trip.kmStart)>0){
    const maxAtPump = expenses
      .filter(e=>e.type==='combustivel' && n(e.kmAtPump)>0)
      .reduce((max,e)=>Math.max(max, n(e.kmAtPump)), 0);
    if(maxAtPump > n(trip.kmStart)){
      kmRun = maxAtPump - n(trip.kmStart);
      kmRunPartial = true;
    }
  }

  const expCatMap={
    alimentacao:{i:'🍽️',l:'Alimentação',c:'#10b981'},
    combustivel:{i:'⛽',l:'Combustível',c:'#3b82f6'},
    hospedagem:{i:'🏨',l:'Hospedagem',c:'#a78bfa'},
    outros:{i:'📦',l:'Outros',c:'#f59e0b'}
  };
  const expHtml=expenses.length?expenses.slice().reverse().map(e=>{
    const cat=expCatMap[e.type]||{i:'📦',l:e.type,c:'#94a3b8'};
    let sub='';
    if(e.type==='alimentacao' && e.mealType) sub=({cafe:'☕ Café',almoco:'🍛 Almoço',janta:'🍴 Jantar',lanche:'🥪 Lanche'}[e.mealType])||e.mealType;
    else if(e.type==='combustivel') sub=`${e.liters?n(e.liters).toFixed(2)+'L · ':''}${e.kmAtPump?'KM '+e.kmAtPump+' · ':''}${e.pricePerLiter?R(e.pricePerLiter)+'/L':''}`;
    else if(e.description) sub=e.description;
    return `<div class="lanc-row" onclick="confirmDeleteLanc('${trip.id}','${e.id}','${cat.l}')">
      <div class="lanc-icon" style="color:${cat.c}">${cat.i}</div>
      <div class="lanc-info">
        <div class="lanc-title">${cat.l}</div>
        <div class="lanc-sub">${fmtDate(e.date)}${sub?' · '+sub:''}</div>
      </div>
      <div class="lanc-amt">${R(e.amount)}</div>
    </div>`;
  }).join(''):`<div class="empty" style="padding:24px"><div class="empty-ic">📭</div><div class="empty-tx">Nenhum lançamento ainda</div><div class="empty-sub">Quando abastecer, almoçar ou tiver qualquer despesa, lance aqui.</div></div>`;

  const stClass=trip.status==='andamento'?'pill-and':trip.status==='programada'?'pill-prog':'pill-fim';
  const stLabel=trip.status==='andamento'?'🟢 Em Andamento':trip.status==='programada'?'⏳ Programada':'✅ Finalizada';

  // Botão de ação principal
  let mainAction='';
  if(trip.status==='programada'){
    mainAction=`<button class="btn btn-sc btn-lg" onclick="openStartTripModal('${trip.id}')">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
      Iniciar Viagem
    </button>`;
  } else if(trip.status==='andamento'){
    mainAction=`<button class="btn btn-pr btn-lg" onclick="openCategoryPicker('${trip.id}')">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Fazer Novo Lançamento
    </button>
    <button class="btn btn-dg btn-lg" style="margin-top:10px" onclick="openFinishTripModal('${trip.id}')">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polygon points="6 4 6 20 20 12 6 4"/></svg>
      Finalizar Viagem
    </button>`;
  } else {
    mainAction=`<button class="btn btn-vio btn-lg" onclick="exportTripToManager('${trip.id}')">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      Enviar pro Gestor
    </button>`;
  }

  root.innerHTML=`
    <div class="app-head">
      <button class="head-btn" onclick="backToHome()" title="Voltar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      </button>
      <div class="head-info">
        <div class="head-title">${trip.origin||'?'} → ${trip.destination||'?'}</div>
        <div class="head-sub">${trip.code||trip.id.slice(0,10)}</div>
      </div>
      <span class="pill ${stClass}">${stLabel}</span>
    </div>

    <div class="section">
      <!-- Info Card -->
      <div class="card" style="margin-bottom:14px">
        <div class="trip-meta" style="margin:0">
          <span>📅 <b>${fmtDate(trip.date)}</b>${trip.returnDate?` → ${fmtDate(trip.returnDate)}`:''}</span>
          ${trip.vehiclePlate?`<span>🚐 <b>${trip.vehiclePlate}</b>${trip.vehicleModel?' · '+trip.vehicleModel:''}</span>`:''}
          ${trip.client?`<span>👤 ${trip.client}</span>`:''}
        </div>
        ${trip.description?`<div style="font-size:12.5px;color:var(--txm);margin-top:8px;font-style:italic">${trip.description}</div>`:''}
      </div>

      <!-- 🆕 Detalhes do embarque (vindos do gestor) -->
      ${(trip.pickupTime||trip.itinerary||trip.passengers||trip.clientPhone)?`
      <div class="card" style="margin-bottom:14px;background:linear-gradient(135deg,rgba(167,139,250,.08),rgba(99,102,241,.04));border:1px solid rgba(167,139,250,.25)">
        <div style="font-size:11.5px;font-weight:800;letter-spacing:.4px;color:#a5b4fc;text-transform:uppercase;margin-bottom:10px">📋 Informações do embarque</div>
        ${trip.pickupTime?`<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(148,163,184,.08);font-size:13.5px"><span class="txm">🕐 Horário de embarque</span><b style="color:#fff">${trip.pickupTime}</b></div>`:''}
        ${trip.itinerary?`<div style="padding:8px 0;border-bottom:1px solid rgba(148,163,184,.08);font-size:13px">
          <div class="txm" style="margin-bottom:6px;font-weight:700">📝 Detalhes da viagem</div>
          <div style="color:#fff;white-space:pre-wrap;line-height:1.55;background:rgba(255,255,255,.03);border-radius:8px;padding:10px 12px;font-size:13px">${(trip.itinerary||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}</div>
        </div>`:''}
        ${trip.passengers?`<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(148,163,184,.08);font-size:13.5px"><span class="txm">👥 Passageiros</span><b style="color:#fff">${trip.passengers}</b></div>`:''}
        ${trip.clientPhone?`<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:13.5px"><span class="txm">📞 Contato do cliente</span>
          <a href="https://wa.me/55${(trip.clientPhone||'').replace(/\\D/g,'')}" target="_blank" style="background:rgba(34,197,94,.18);color:#34d399;padding:5px 12px;border-radius:8px;font-weight:700;text-decoration:none;font-size:12.5px">💬 ${trip.clientPhone}</a>
        </div>`:''}
      </div>`:''}

      ${trip.status!=='programada'?`
        <div class="quick-stats">
          <div class="qs"><div class="qs-l">KM rodado${kmRunPartial?' <span style="font-size:9px;color:#67e8f9">(parcial)</span>':''}</div><div class="qs-v" style="${kmRunPartial?'color:#67e8f9':''}">${kmRun?kmRun.toLocaleString('pt-BR')+' km':'—'}</div></div>
          <div class="qs"><div class="qs-l">Lançamentos</div><div class="qs-v">${expenses.length}</div></div>
          <div class="qs"><div class="qs-l">Total Gasto</div><div class="qs-v" style="color:#fca5a5;font-size:13.5px">${R(totalExp)}</div></div>
        </div>
      `:''}

      ${trip.status==='programada'?`<div class="banner info">
        💡 <span>Quando estiver pronto pra começar, clique em <b>Iniciar Viagem</b>. Você vai precisar informar o KM inicial e o último abastecimento.</span>
      </div>`:''}

      ${trip.status==='andamento'?`<div class="big-kpi">

      </div>`:''}

      ${trip.status==='finalizada'?`<div class="big-kpi">
        <div class="big-kpi-l">Quilometragem</div>

        <div class="big-kpi-s">${(trip.kmStart||0).toLocaleString('pt-BR')} → ${(trip.kmEnd||0).toLocaleString('pt-BR')} km</div>
      </div>`:''}

      ${trip.status!=='programada'?renderFuelMetaCard(trip):''}

      ${mainAction}

      ${trip.status!=='programada'?`
        <div class="section-title" style="margin-top:24px">Lançamentos da viagem</div>
        ${expHtml}
      `:''}
    </div>
  `;

function confirmDeleteLanc(tripId, lancId, label){

function calcFuelTotal(idL,idP,idT){
  const L=n(document.getElementById(idL).value);

    document.getElementById(idT).value=(L*P).toFixed(2).replace('.',',');
  }
}
function startTrip(tripId){
  const trip=DB.trips.find(t=>t.id===tripId); if(!trip) return;
  const km=n(document.getElementById('st-km').value);
  if(km<=0){ showToast('Informe o KM inicial','warn'); return; }
  const when=document.getElementById('st-when').value;
  trip.kmStart=km;
  trip.startedAt=when||new Date().toISOString();
  trip.status='andamento';
  // Abastecimento inicial (opcional)
  const fuelL=n(document.getElementById('st-fuel-liters').value);
  const fuelT=n(document.getElementById('st-fuel-total').value);
  if(fuelL>0||fuelT>0){
    trip.expenses=trip.expenses||[];
    trip.expenses.push({
      id:uid('lanc'),
      type:'combustivel',
      date:when?when.split('T')[0]:new Date().toISOString().split('T')[0],
      amount:fuelT,
      liters:fuelL,
      pricePerLiter:n(document.getElementById('st-fuel-pl').value),
      kmAtPump:km,
      label:'Abastecimento inicial'
    });
  }
  trip._lastChange=Date.now();

  closeAllOverlays();

}

function saveLanc(tripId, type){
  const trip=DB.trips.find(t=>t.id===tripId); if(!trip) return;
  const amount=n(document.getElementById('l-amount').value);
  if(amount<=0){ showToast('Informe o valor','warn'); return; }
  const date=document.getElementById('l-date').value || new Date().toISOString().split('T')[0];
  const lanc={
    id:uid('lanc'),
    type,
    amount,
    date
  };
  if(type==='alimentacao'){
    lanc.mealType=document.getElementById('l-meal').value;
    lanc.description=(document.getElementById('l-desc').value||'').trim();
  } else if(type==='combustivel'){
    const km=n(document.getElementById('l-km').value);
    if(km<=0){ showToast('Informe o KM no momento do abastecimento','warn'); return; }
    lanc.kmAtPump=km;
    lanc.liters=n(document.getElementById('l-liters').value);
    lanc.pricePerLiter=n(document.getElementById('l-pl').value);
    lanc.description=(document.getElementById('l-desc').value||'').trim();
  } else if(type==='hospedagem'){
    lanc.description=(document.getElementById('l-desc').value||'').trim();
    lanc.days=parseInt(document.getElementById('l-days').value)||1;
    lanc.city=(document.getElementById('l-city').value||'').trim();
  } else {
    const desc=(document.getElementById('l-desc').value||'').trim();
    if(!desc){ showToast('Descreva o que foi gasto','warn'); return; }
    lanc.description=desc;
  }
  trip.expenses=trip.expenses||[];
  trip.expenses.push(lanc);
  trip._lastChange=Date.now();
  saveDB();
  closeAllOverlays();
  showToast('💾 Lançamento salvo!','ok');
  render();
}

function finishTrip(tripId){
  const trip=DB.trips.find(t=>t.id===tripId); if(!trip) return;
  const km=n(document.getElementById('ft-km').value);
  if(km<=0){ showToast('Informe o KM final','warn'); return; }
  if(km < n(trip.kmStart)){ showToast('KM final não pode ser menor que o inicial!','err'); return; }
  const fuelL=n(document.getElementById('ft-fuel-liters').value);
  const fuelP=n(document.getElementById('ft-fuel-pl').value);
  const fuelT=n(document.getElementById('ft-fuel-total').value);
  if(fuelL<=0 || fuelT<=0){ showToast('⚠️ Informe o abastecimento final (litros + total)','err'); return; }
  const when=document.getElementById('ft-when').value;
  trip.kmEnd=km;
  trip.finishedAt=when||new Date().toISOString();
  trip.status='finalizada';
  trip.expenses=trip.expenses||[];
  trip.expenses.push({
    id:uid('lanc'),
    type:'combustivel',
    date:when?when.split('T')[0]:new Date().toISOString().split('T')[0],
    amount:fuelT,
    liters:fuelL,
    pricePerLiter:fuelP,
    kmAtPump:km,
    label:'Abastecimento final (tanque cheio)',
    isFinalFuel:true
  });
  trip._lastChange=Date.now();
  saveDB();
  closeAllOverlays();
  showToast('🏁 Viagem finalizada! Não esqueça de enviar pro gestor.','ok');
  render();
}

// ════════ EXPORTAR PRO GESTOR ════════
function exportTripToManager(tripId){
  const trip=DB.trips.find(t=>t.id===tripId); if(!trip) return;
  const payload={
    type:'muvcity-trip-result',
    version:'1.0',
    exportedAt:new Date().toISOString(),
    exportedBy:DB.driver.name,
    driverPhone:DB.driver.phone,
    trip:trip
  };
  const json=JSON.stringify(payload,null,2);
  // Tenta usar Web Share API (celular)
  if(navigator.share){
    const blob=new Blob([json],{type:'application/json'});
    const file=new File([blob],`muvcity_${trip.code||trip.id}_${DB.driver.name.split(' ')[0]}.json`,{type:'application/json'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      navigator.share({title:'Viagem MuvCity', text:`Viagem ${trip.code||''} de ${DB.driver.name}`, files:[file]}).catch(()=>downloadJSON(json,trip));
      return;
    }
  }
  downloadJSON(json,trip);
}
function downloadJSON(json, trip){
  const blob=new Blob([json],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download=`muvcity_${trip.code||trip.id.slice(0,10)}_${(DB.driver.name||'motorista').split(' ')[0]}.json`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('📤 Arquivo gerado! Envie pro gestor pelo WhatsApp.','ok');
}

// ════════ DETECTAR VIAGEM NA URL ════════
async function checkURLForTrip(){
  try{
    const params=new URLSearchParams(location.search);
    // Novo formato: ?codigo=123456
    const codigo=params.get('codigo');
    if(codigo && /^\d{6}$/.test(codigo)){
      // Aguarda o app inicializar antes de buscar
      setTimeout(()=>{
        const inp=document.createElement('input');
        // Simula entrada do código
        if(DB.driver){
          // Já está cadastrado — abre o modal com código preenchido
          openImportModal();
          setTimeout(()=>{
            const e=document.getElementById('imp-code');
            if(e){ e.value=codigo; fetchTripByCode(); }
          },300);
        }
        history.replaceState({},'',location.pathname);
      },1000);
      return;
    }
    // Formato antigo (base64) — mantém compatibilidade
    const tripCode=params.get('trip');
    if(!tripCode) return;
    const json=JSON.parse(decodeURIComponent(escape(atob(tripCode))));
    if(json && json.type==='muvcity-trip' && json.trip){
      const t=json.trip;
      if(!DB.trips.some(x=>x.id===t.id)){
        t.status=t.status||'programada';
        t.expenses=t.expenses||[];
        t.createdAt=t.createdAt||new Date().toISOString();
        DB.trips.push(t);
        saveDB();
        showToast('✅ Viagem recebida do gestor!','ok');
        history.replaceState({},'',location.pathname);
      }
    }
  }catch(_){}
}
