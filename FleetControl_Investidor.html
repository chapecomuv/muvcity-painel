<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0d1829">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MuvCity Investidor">
<title>MuvCity — Investidor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#060d1a;--bg2:#0c1727;--bg3:#162033;
  --tx:#e6ecf6;--txm:#7689a1;--bd:rgba(148,163,184,.14);
  --vio:#a78bfa;--vio2:#c4b5fd;
  --sc:#10b981;--sc2:#34d399;
  --wn:#f59e0b;--wn2:#fbbf24;
  --dg:#ef4444;
  --pr:#3b82f6;--prl:#60a5fa;
}
html,body{height:100%}
body{
  font-family:'Inter',system-ui,sans-serif;
  background:
    radial-gradient(900px 600px at 50% -100px,rgba(167,139,250,.18),transparent 60%),
    radial-gradient(700px 500px at 100% 100%,rgba(16,185,129,.10),transparent 60%),
    var(--bg);
  background-attachment:fixed;
  color:var(--tx);font-size:15px;line-height:1.55;
  overflow-x:hidden;
}
.app{max-width:520px;margin:0 auto;min-height:100vh;padding:0 0 40px}
/* Header */
.app-head{
  position:sticky;top:0;z-index:10;
  background:linear-gradient(180deg,rgba(6,13,26,.96),rgba(6,13,26,.85));
  backdrop-filter:blur(14px);
  border-bottom:1px solid rgba(148,163,184,.1);
  padding:16px 20px;display:flex;align-items:center;gap:14px
}
.brand-mini{
  width:44px;height:44px;border-radius:13px;
  background:linear-gradient(135deg,#a78bfa,#7c3aed);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 18px rgba(167,139,250,.4);flex-shrink:0;color:#fff
}
.head-info{flex:1;min-width:0}
.head-greeting{font-size:11.5px;color:var(--txm);text-transform:uppercase;letter-spacing:.5px;font-weight:700}
.head-title{font-size:17px;font-weight:800;letter-spacing:-.2px;color:#fff}
.head-sub{font-size:12px;color:var(--txm);margin-top:1px}

.section{padding:18px 20px}
.section-title{
  font-size:11.5px;color:var(--txm);text-transform:uppercase;letter-spacing:1px;
  margin:18px 4px 12px;font-weight:800
}

/* Big KPI cards */
.kpi-big{
  background:linear-gradient(135deg,rgba(255,255,255,.04),rgba(255,255,255,.02));
  border:1px solid var(--bd);
  border-radius:18px;padding:22px 20px;
  box-shadow:0 8px 24px rgba(0,0,0,.25);
  position:relative;overflow:hidden;
  margin-bottom:12px
}
.kpi-big::before{
  content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--vio),var(--sc));opacity:.85
}
.kpi-big.received::before{background:linear-gradient(90deg,#10b981,#34d399)}
.kpi-big.invested::before{background:linear-gradient(90deg,#3b82f6,#60a5fa)}
.kpi-big.pending::before{background:linear-gradient(90deg,#f59e0b,#fbbf24)}
.kpi-big-lbl{
  font-size:11.5px;color:var(--txm);text-transform:uppercase;letter-spacing:.7px;
  font-weight:800;margin-bottom:6px;display:flex;align-items:center;gap:6px
}
.kpi-big-val{font-size:32px;font-weight:900;letter-spacing:-1px;line-height:1.1}
.kpi-big.received .kpi-big-val{color:#34d399}
.kpi-big.invested .kpi-big-val{color:#60a5fa}
.kpi-big.pending .kpi-big-val{color:#fbbf24}
.kpi-big-sub{font-size:13px;color:var(--txm);margin-top:8px}

/* Monthly cards */
.month-card{
  background:rgba(255,255,255,.025);
  border:1px solid var(--bd);
  border-radius:14px;padding:16px;margin-bottom:10px;
  transition:transform .12s
}
.month-card.paid{border-color:rgba(16,185,129,.3);background:rgba(16,185,129,.05)}
.month-card.pending{border-color:rgba(245,158,11,.3);background:rgba(245,158,11,.04)}
.month-card.loss{opacity:.6}
.month-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.month-name{font-size:15px;font-weight:800}
.month-badge{
  font-size:10.5px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;
  padding:4px 10px;border-radius:11px
}
.badge-paid{background:rgba(16,185,129,.18);color:#10b981}
.badge-pending{background:rgba(245,158,11,.18);color:#f59e0b}
.badge-loss{background:rgba(148,163,184,.18);color:var(--txm)}
.badge-future{background:rgba(99,102,241,.15);color:#a5b4fc}
.month-row{display:flex;justify-content:space-between;padding:6px 0;font-size:13.5px}
.month-row b{color:#fff;font-weight:700}
.month-row.highlight{
  margin-top:8px;padding-top:10px;
  border-top:1px dashed rgba(148,163,184,.18);
  font-weight:700
}
.month-row.highlight b{font-size:16px}

/* Info card */
.info-card{
  background:linear-gradient(135deg,rgba(167,139,250,.08),rgba(167,139,250,.03));
  border:1px solid rgba(167,139,250,.25);
  border-radius:14px;padding:16px;font-size:13.5px;line-height:1.6
}
.info-card b{color:var(--vio2)}
.info-icon{font-size:22px;margin-bottom:6px;display:block}

.vehicle-card{
  background:rgba(255,255,255,.025);
  border:1px solid var(--bd);
  border-radius:14px;padding:16px;display:flex;gap:14px;align-items:center
}

/* Navegador de meses */
.month-nav{
  display:flex;align-items:center;gap:6px;
  background:rgba(255,255,255,.025);
  border:1px solid var(--bd);
  border-radius:12px;padding:6px;margin-bottom:14px
}
.month-nav-btn{
  width:38px;height:38px;border-radius:9px;
  background:rgba(255,255,255,.04);
  color:#cbd5f5;font-size:16px;font-weight:800;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;flex-shrink:0;transition:all .15s
}
.month-nav-btn:hover:not(:disabled){background:rgba(255,255,255,.08);color:#fff}
.month-nav-btn:disabled{opacity:.3;cursor:not-allowed}
.month-nav-label{
  flex:1;text-align:center;font-size:14.5px;font-weight:800;
  letter-spacing:-.2px;color:#fff
}
.month-nav-toggle{
  font-size:11.5px;font-weight:700;color:var(--vio2);
  background:rgba(167,139,250,.1);border:1px solid rgba(167,139,250,.25);
  border-radius:9px;padding:7px 11px;cursor:pointer;
  text-align:center;margin-bottom:14px;width:100%;letter-spacing:.3px
}
.month-nav-toggle:hover{background:rgba(167,139,250,.18)}
.vehicle-ic{
  width:54px;height:54px;border-radius:13px;
  background:linear-gradient(135deg,#3b82f6,#60a5fa);
  display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0
}
.vehicle-info{flex:1;min-width:0}
.vehicle-name{font-size:15px;font-weight:800;color:#fff}
.vehicle-sub{font-size:12.5px;color:var(--txm);margin-top:2px}

/* Loading & empty states */
.center-screen{
  min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:24px;text-align:center
}
.spinner{
  width:48px;height:48px;border-radius:50%;
  border:4px solid rgba(167,139,250,.18);border-top-color:var(--vio);
  animation:spin 1s linear infinite;margin-bottom:16px
}
@keyframes spin{to{transform:rotate(360deg)}}
.empty-tx{font-size:17px;font-weight:700;margin-bottom:6px}
.empty-sub{font-size:13.5px;color:var(--txm);max-width:360px}

.footer-note{
  text-align:center;font-size:11px;color:var(--txm);padding:24px 20px 0;
  letter-spacing:.3px
}
.footer-note b{color:#a78bfa}

/* Animação de entrada */
.fade-in{animation:fadeIn .4s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* Details/summary expansível */
details summary{outline:none}
details summary::-webkit-details-marker{display:none}
details summary::marker{display:none;content:''}
details summary .caret{display:inline-block;transition:transform .2s ease;font-size:10px}
details[open] summary .caret{transform:rotate(90deg)}
</style>
</head>
<body>
<div id="app" class="app">
  <div class="center-screen">
    <div class="spinner"></div>
    <div class="empty-tx">Carregando seu painel…</div>
  </div>
</div>

<script>
// ════════════════════════════════════════════════════════════
//  MUVCITY — PAINEL DO INVESTIDOR (somente leitura)
// ════════════════════════════════════════════════════════════
const FIREBASE_URL = 'https://muvcity-painel-default-rtdb.firebaseio.com/db.json';

// Estado da UI: filtro de mês.
// monthFilterIdx = null → mostra TODOS; número (0..N-1) → mostra só o mês daquele índice (mais recente=0)
let monthFilterIdx = 0;   // padrão: mês mais recente
let _lastRender = null;   // { db, investor } pra re-render quando filtro muda

function setMonthFilter(idx){
  monthFilterIdx = idx;
  if(_lastRender) render(_lastRender.db, _lastRender.investor);
  window.scrollTo({top:document.querySelector('.section-title')?.offsetTop-20||0, behavior:'smooth'});
}
function toggleMonthFilter(){
  setMonthFilter(monthFilterIdx===null ? 0 : null);
}

// ── helpers ──
function n(v){
  if(v==null||v==='') return 0;
  const s=String(v).trim();
  if(s.includes(',')) return parseFloat(s.replace(/\./g,'').replace(',','.'))||0;
  return parseFloat(s)||0;
}
function R(v){ return new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(v||0); }
function monthName(y,m){
  const s = new Date(y,m,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
  // Capitaliza só a 1ª letra (mantém "de" minúsculo) → "Maio de 2026"
  return s.charAt(0).toUpperCase()+s.slice(1);
}
function inMonth(dateStr,y,m){
  if(!dateStr) return false;
  const d=new Date(dateStr+'T00:00:00');
  return d.getFullYear()===y && d.getMonth()===m;
}
function monthKey(y,m){ return `${y}-${String(m+1).padStart(2,'0')}`; }
function getURLParam(name){ return new URLSearchParams(location.search).get(name); }

// ── Cálculo de lucro mensal do veículo (mesma lógica do painel do gestor) ──
// Retorna também breakdown em categorias amigáveis + lista de viagens.
function calcMonthlyVehicleProfit(db, y, m, vehicleId){
  const trips = (db.trips||[]).filter(t=>inMonth(t.date||t.departureDate,y,m) && t.vehicleId===vehicleId);
  const exps  = (db.varExpenses||[]).filter(e=>inMonth(e.date,y,m) && e.vehicleId===vehicleId);

  // Categorias amigas
  let grossRev=0;
  let operacao=0;     // combustível + pedágio + hospedagem + alimentação + impostos das viagens + outros das viagens
  let motorista=0;    // custo do motorista nas viagens
  let manutencao=0;   // manutenção (das trips + varExpenses do tipo manutencao/pneus/etc)
  let fixos=0;        // financiamento + IPVA + seguro + ANTT + licenciamento + multa + rastreamento (de varExpenses + fixedCommitments)
  let compartilhadas=0;
  let outros=0;       // varExpenses não enquadradas

  trips.forEach(t=>{
    grossRev += n(t.grossRevenue);
    operacao += n(t.fuelCost) + n(t.tollCost) + n(t.accommodationCost) + n(t.foodCost) + n(t.otherCost) + n(t.taxAmount);
    motorista += n(t.driverCost);
    manutencao += n(t.maintenanceCost);
  });

  // Classifica varExpenses em categorias
  const fixedCats = new Set(['ipva','seguro','antt','sie','licenciamento','financiamento','multa','rastreamento','mensalidade','aquisicao','aluguel']);
  const maintCats = new Set(['manutencao','pneus','oleo','freios','suspensao','eletrica','ar_condicionado']);
  exps.forEach(e=>{
    const cat = (e.category||'').toLowerCase();
    const amt = n(e.amount);
    if(maintCats.has(cat) || cat.includes('manutenc')) manutencao += amt;
    else if(fixedCats.has(cat)) fixos += amt;
    else if(cat==='combustivel'||cat==='pedagio'||cat==='hospedagem'||cat==='alimentacao'||cat==='motorista') operacao += amt;
    else outros += amt;
  });

  // Despesas fixas (fixedCommitments) do veículo no mês
  (db.fixedCommitments||[]).forEach(fc=>{
    if(fc.vehicleId !== vehicleId) return;
    if(!fc.installmentValue) return;
    if(!fc.startDate) return;
    const sd = new Date(fc.startDate+'T00:00:00');
    const cur = new Date(y, m, fc.dueDay||1);
    if(cur<sd) return;
    if(fc.totalInstallments){
      const end = new Date(sd);
      end.setMonth(end.getMonth()+(fc.totalInstallments-1));
      if(cur>end) return;
    } else if(fc.endDate){
      const ed = new Date(fc.endDate+'T00:00:00');
      if(cur>ed) return;
    }
    fixos += n(fc.installmentValue);
  });

  // Despesas compartilhadas (rateio)
  const activeVehicles = (db.vehicles||[]).filter(v=>v.active!==false).length || 1;
  const sKey = monthKey(y,m);
  (db.sharedExpenses||[]).forEach(se=>{
    if(!se.active) return;
    if(se.startMonth && sKey<se.startMonth) return;
    const paid = (se.payments||[]).find(p=>p.monthKey===sKey);
    const amount = paid ? n(paid.amount) : n(se.baseAmount);
    if(amount<=0) return;
    const sType = se.splitType==='equal' ? 'all' : se.splitType;
    if(sType==='all'){
      compartilhadas += amount/activeVehicles;
    } else if(sType==='selected'){
      const sel = se.selectedVehicleIds||[];
      if(sel.includes(vehicleId)) compartilhadas += amount/(sel.length||1);
    }
  });

  const r2=v=>Math.round(v*100)/100;
  const totalExp = r2(operacao + motorista + manutencao + fixos + compartilhadas + outros);
  const netProfit = r2(grossRev - totalExp);

  // Lista resumida de viagens (sem cliente, só origem→destino + valor)
  const tripsList = trips.map(t=>({
    date: t.date||t.departureDate,
    origin: t.origin||'',
    destination: t.destination||'',
    description: t.description||'',
    revenue: n(t.grossRevenue)
  })).sort((a,b)=>(a.date||'').localeCompare(b.date||''));

  return {
    grossRev: r2(grossRev),
    totalExp,
    netProfit,
    tripCount: trips.length,
    breakdown: {
      operacao: r2(operacao),
      motorista: r2(motorista),
      manutencao: r2(manutencao),
      fixos: r2(fixos),
      compartilhadas: r2(compartilhadas),
      outros: r2(outros)
    },
    trips: tripsList
  };
}

// ── Renderização principal ──
function render(db, investor){
  _lastRender = { db, investor };
  const root = document.getElementById('app');
  const veh = (db.vehicles||[]).find(v=>v.id===investor.vehicleId) || {};
  const vehLabel = [veh.brand, veh.model].filter(Boolean).join(' ') || 'Veículo';
  const vehPlate = veh.plate ? veh.plate : '—';
  const pct = parseFloat(investor.returnPercentage)||0;
  const aporte = n(investor.investedAmount);

  // Determina meses desde startDate até o mês atual
  const start = investor.startDate ? new Date(investor.startDate+'T00:00:00') : new Date();
  const today = new Date();
  const months = [];
  const startKey = `${start.getFullYear()}-${start.getMonth()}`;
  let y = start.getFullYear(), m = start.getMonth();
  while(y < today.getFullYear() || (y===today.getFullYear() && m <= today.getMonth())){
    months.push({y, m});
    m++; if(m>11){ m=0; y++; }
  }

  // Para cada mês, calcula o retorno
  const monthData = months.map(({y,m})=>{
    const r = calcMonthlyVehicleProfit(db, y, m, investor.vehicleId);
    const returnDue = (investor.returnType==='proportional' && pct>0 && r.netProfit>0)
      ? Math.round(r.netProfit*(pct/100)*100)/100
      : 0;
    // pagamentos lançados naquele mês
    const mKey = monthKey(y,m);
    const mNameLow = monthName(y,m).split(' de ')[0].toLowerCase();
    const paid = (investor.payments||[]).filter(p=>{
      if(p.monthKey) return p.monthKey===mKey;
      return (p.ref||'').toLowerCase().includes(mNameLow) && (p.ref||'').includes(String(y));
    }).reduce((s,p)=>s+n(p.amount),0);
    return { y, m, profit: r.netProfit, grossRev: r.grossRev, totalExp: r.totalExp,
             breakdown: r.breakdown, tripsList: r.trips,
             tripCount: r.tripCount, returnDue, paid };
  }).reverse();   // mais recente primeiro

  // Totais
  const totalDue = monthData.reduce((s,md)=>s+md.returnDue,0);
  const totalPaid = (investor.payments||[]).reduce((s,p)=>s+n(p.amount),0);
  const balance = Math.max(0, totalDue - totalPaid);
  const aporteRecuperadoPct = aporte>0 ? (totalPaid/aporte)*100 : 0;

  // Aplica filtro de mês
  // Se monthFilterIdx é null → mostra todos; senão, ajusta pro range válido e mostra só aquele mês
  let visibleData = monthData;
  let navHtml = '';
  if(monthData.length>0){
    if(monthFilterIdx===null){
      // Modo "todos" — só mostra o toggle
      navHtml = `<button class="month-nav-toggle" onclick="setMonthFilter(0)">📅 Ver mês a mês (navegação)</button>`;
    } else {
      // Modo "mês específico"
      const idx = Math.max(0, Math.min(monthFilterIdx, monthData.length-1));
      monthFilterIdx = idx;
      visibleData = [monthData[idx]];
      const curMonthName = monthName(monthData[idx].y, monthData[idx].m);
      navHtml = `
        <div class="month-nav">
          <button class="month-nav-btn" onclick="setMonthFilter(${idx+1})" ${idx>=monthData.length-1?'disabled':''} title="Mês anterior">◀</button>
          <div class="month-nav-label">${curMonthName}</div>
          <button class="month-nav-btn" onclick="setMonthFilter(${idx-1})" ${idx<=0?'disabled':''} title="Próximo mês">▶</button>
        </div>
        <button class="month-nav-toggle" onclick="setMonthFilter(null)">📋 Ver todos os meses</button>`;
    }
  }

  // Render
  const firstName = (investor.name||'Investidor').split(' ')[0];
  const monthsHtml = visibleData.map(md=>{
    const mName = monthName(md.y, md.m);
    const isFuture = (md.y > today.getFullYear()) || (md.y===today.getFullYear() && md.m > today.getMonth());
    let badge, klass;
    if(isFuture){
      badge = `<span class="month-badge badge-future">📅 Em andamento</span>`;
      klass = '';
    } else if(md.profit<=0 && md.tripCount===0){
      badge = `<span class="month-badge badge-loss">— Sem viagens</span>`;
      klass = 'loss';
    } else if(md.profit<=0){
      badge = `<span class="month-badge badge-loss">— Prejuízo</span>`;
      klass = 'loss';
    } else if(md.paid>=md.returnDue && md.returnDue>0){
      badge = `<span class="month-badge badge-paid">✅ Pago</span>`;
      klass = 'paid';
    } else if(md.returnDue>0){
      badge = `<span class="month-badge badge-pending">⏳ A receber</span>`;
      klass = 'pending';
    } else {
      badge = `<span class="month-badge badge-loss">—</span>`;
      klass = 'loss';
    }
    let detail = '';
    if(md.tripCount>0){
      // Resumo principal — sempre visível
      detail = `
        <div class="month-row"><span>💰 Quanto o veículo faturou</span><b style="color:#34d399">${R(md.grossRev)}</b></div>
        <div class="month-row"><span>💸 Quanto teve de despesas</span><b style="color:#f87171">${R(md.totalExp)}</b></div>
        <div class="month-row highlight"><span>📈 Sobrou de lucro</span><b style="color:${md.profit>=0?'#10b981':'#ef4444'}">${R(md.profit)}</b></div>`;
      if(md.profit>0 && pct>0){
        detail += `<div class="month-row"><span>🤝 Sua parte (${pct}%)</span><b style="color:#a78bfa">${R(md.returnDue)}</b></div>`;
        if(md.paid>0){
          detail += `<div class="month-row"><span>✅ Você já recebeu</span><b style="color:#10b981">${R(md.paid)}</b></div>`;
        }
        if(!isFuture && md.paid<md.returnDue){
          const falta = md.returnDue - md.paid;
          detail += `<div class="month-row" style="font-weight:700"><span>⏳ Falta receber</span><b style="color:#f59e0b">${R(falta)}</b></div>`;
        }
      }
      // Detalhamento expansível
      const b = md.breakdown||{};
      const expRows = [
        ['🛣️ Operação (combustível, pedágio, hospedagem, alimentação, impostos)', b.operacao],
        ['👤 Motorista (diárias)', b.motorista],
        ['🔧 Manutenção', b.manutencao],
        ['🏦 Custos Fixos (financiamento, IPVA, seguro, etc.)', b.fixos],
        ['🏢 Compartilhadas (rateio entre veículos)', b.compartilhadas],
        ['📦 Outros', b.outros]
      ].filter(([_,v])=>v>0);
      const tripsRows = (md.tripsList||[]).map(tr=>{
        const rota = (tr.origin||tr.destination) ? `${tr.origin||'?'} → ${tr.destination||'?'}` : (tr.description||'Viagem');
        const dt = tr.date ? new Date(tr.date+'T00:00:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'}) : '';
        return `<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid rgba(148,163,184,.07);font-size:12.5px">
          <span style="color:var(--txm)">${dt} · ${rota}</span>
          <b style="color:#34d399">${R(tr.revenue)}</b>
        </div>`;
      }).join('');
      detail += `
        <details style="margin-top:12px;padding-top:10px;border-top:1px dashed rgba(148,163,184,.18)">
          <summary style="cursor:pointer;font-size:12.5px;color:var(--vio2);font-weight:700;list-style:none;display:flex;align-items:center;gap:6px">
            <span class="caret">▶</span> Ver detalhamento
          </summary>
          <div style="margin-top:10px">
            ${md.tripsList.length?`<div style="font-size:11.5px;color:var(--txm);text-transform:uppercase;letter-spacing:.4px;font-weight:800;margin-bottom:6px">🛣️ Viagens (${md.tripsList.length})</div>${tripsRows}`:''}
            ${expRows.length?`<div style="font-size:11.5px;color:var(--txm);text-transform:uppercase;letter-spacing:.4px;font-weight:800;margin:14px 0 6px">📊 Despesas por categoria</div>${expRows.map(([lbl,val])=>`<div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid rgba(148,163,184,.07);font-size:12.5px"><span style="color:var(--txm)">${lbl}</span><b style="color:#f87171">${R(val)}</b></div>`).join('')}`:''}
          </div>
        </details>`;
    } else if(isFuture){
      detail = `<div class="month-row" style="color:var(--txm);font-style:italic">📊 O mês ainda não fechou. Aguarde o fim para ver o resultado.</div>`;
    } else {
      detail = `<div class="month-row" style="color:var(--txm);font-style:italic">Nenhuma viagem registrada neste mês.</div>`;
    }
    return `<div class="month-card ${klass} fade-in">
      <div class="month-head">
        <div class="month-name">${mName}</div>
        ${badge}
      </div>
      ${detail}
    </div>`;
  }).join('');

  root.innerHTML = `
    <header class="app-head">
      <div class="brand-mini">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>
      </div>
      <div class="head-info">
        <div class="head-greeting">Olá, ${firstName} 👋</div>
        <div class="head-title">Seu Investimento</div>
        <div class="head-sub">Painel atualizado em tempo real</div>
      </div>
    </header>

    <div class="section">

      <div class="kpi-big received fade-in">
        <div class="kpi-big-lbl">💰 Você já recebeu</div>
        <div class="kpi-big-val">${R(totalPaid)}</div>
        <div class="kpi-big-sub">de R$ ${R(totalDue).replace('R$','').trim()} que rendeu até agora <b style="color:#34d399">(${aporteRecuperadoPct.toFixed(1)}% do aporte)</b></div>
      </div>

      <div class="kpi-big invested fade-in">
        <div class="kpi-big-lbl">📥 Você colocou</div>
        <div class="kpi-big-val">${R(aporte)}</div>
        <div class="kpi-big-sub">na ${vehLabel} <b>${vehPlate}</b></div>
      </div>

      <div class="kpi-big pending fade-in">
        <div class="kpi-big-lbl">⏳ Está pra receber</div>
        <div class="kpi-big-val">${R(balance)}</div>
        <div class="kpi-big-sub">referente aos meses que ainda não foram repassados</div>
      </div>

      <div class="section-title">📅 Mês a Mês</div>
      ${navHtml}
      ${monthsHtml || `<div class="info-card">Ainda não há meses para mostrar. O primeiro fechamento aparece quando o mês de ${monthName(start.getFullYear(),start.getMonth())} fechar.</div>`}

      <div class="section-title">💡 Como funciona</div>
      <div class="info-card fade-in">
        <span class="info-icon">🤝</span>
        Você colocou <b>${R(aporte)}</b> na compra ${vehLabel?'da '+vehLabel:'do veículo'} <b>${vehPlate}</b>.
        Em troca, você recebe <b>${pct}% do lucro líquido</b> de cada mês desse veículo específico.
        <br><br>
        Se o mês der <b style="color:#f87171">prejuízo</b>, não tem desconto pra você — você só recebe quando o veículo lucra.
        <br><br>
        Os pagamentos chegam direto na sua conta, conforme combinado com o gestor.
      </div>

      <div class="section-title">🚐 Sobre o veículo</div>
      <div class="vehicle-card fade-in">
        <div class="vehicle-ic">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 17H3a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11a2 2 0 0 1 2 2v3"/><rect x="9" y="11" width="14" height="10" rx="2"/><circle cx="12" cy="21" r="1"/><circle cx="20" cy="21" r="1"/></svg>
        </div>
        <div class="vehicle-info">
          <div class="vehicle-name">${vehLabel}</div>
          <div class="vehicle-sub">Placa <b style="color:#fff">${vehPlate}</b>${veh.purchaseValue?` · Valor da compra ${R(veh.purchaseValue)}`:''}</div>
        </div>
      </div>

      <div class="footer-note">
        🔒 Você está visualizando dados em tempo real.<br>
        Dúvidas? Fale com o gestor pelo WhatsApp.<br>
        <b>MuvCity Transfer</b>
      </div>
    </div>
  `;
}

// ── Tela de erro ──
function renderError(msg, sub){
  document.getElementById('app').innerHTML = `
    <div class="center-screen">
      <div style="font-size:54px;margin-bottom:14px">🔒</div>
      <div class="empty-tx">${msg}</div>
      <div class="empty-sub">${sub||''}</div>
    </div>
  `;
}

// ── Boot ──
(async function init(){
  const id = getURLParam('id');
  if(!id){
    return renderError('Link inválido', 'O link que você abriu não tem o identificador do investidor. Peça um novo link ao gestor.');
  }
  try {
    const res = await fetch(FIREBASE_URL+'?cb='+Date.now());
    if(!res.ok) throw new Error('Falha de rede');
    const data = await res.json();
    if(!data){ throw new Error('Sem dados'); }
    const investor = (data.investors||[]).find(i=>i.id===id);
    if(!investor){
      return renderError('Investidor não encontrado', 'Esse link pode ter expirado. Peça um novo ao gestor.');
    }
    render(data, investor);
    // Auto-refresh a cada 60s pra refletir mudanças
    setInterval(async ()=>{
      try{
        const r=await fetch(FIREBASE_URL+'?cb='+Date.now());
        if(!r.ok) return;
        const d=await r.json();
        const inv=(d.investors||[]).find(i=>i.id===id);
        if(inv) render(d, inv);
      }catch(_){}
    }, 60000);
  } catch(err){
    renderError('Não consegui carregar', 'Verifique sua conexão e tente novamente. Se persistir, fale com o gestor.');
    console.error(err);
  }
})();
</script>
